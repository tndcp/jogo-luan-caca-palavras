<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caça-Palavras Luan Santana</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#1a1a2e;color:#fff;padding:20px;min-height:100vh}
.container{max-width:450px;margin:0 auto}
h1{text-align:center;color:#f2c94c;margin-bottom:30px}
.tela{display:none}
.tela.ativa{display:block}
input{width:100%;padding:15px;font-size:18px;border:none;border-radius:10px;background:rgba(255,255,255,0.1);color:#fff;margin-bottom:15px}
button{width:100%;padding:15px;font-size:18px;border:none;border-radius:10px;background:linear-gradient(90deg,#f2c94c,#d32f2f);color:#000;font-weight:bold;cursor:pointer;margin:5px 0}
button.secundario{background:linear-gradient(90deg,#444,#222);color:#fff}
button.extremo{background:linear-gradient(90deg,#9c27b0,#d32f2f);color:#fff}
.erro{color:#ff6b6b;text-align:center;margin:10px 0}
.grade{display:grid;gap:5px;margin:20px 0}
.casa{aspect-ratio:1;background:rgba(255,255,255,0.08);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer}
.casa.selecionada{background:#f2c94c;color:#000}
.casa.encontrada{background:#4caf50;color:#fff}
.palavras{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}
.palavra{padding:10px 15px;background:rgba(255,255,255,0.08);border-radius:8px}
.palavra.encontrada{opacity:0.4;text-decoration:line-through}
.placar{display:flex;justify-content:space-around;margin:20px 0}
.caixa{text-align:center}
.abas{display:flex;gap:8px;margin:20px 0}
.aba{flex:1;padding:10px;background:rgba(255,255,255,0.05);border-radius:8px;text-align:center;cursor:pointer}
.aba.ativa{background:#f2c94c;color:#000}
.lista-ranking{display:flex;flex-direction:column;gap:8px;margin-top:15px}
.item-ranking{display:flex;gap:10px;padding:12px;background:rgba(255,255,255,0.05);border-radius:8px}
</style>
</head>
<body>
<div class="container">

<!-- TELA LOGIN -->
<div id="telaLogin" class="tela ativa">
  <h1>🔐 Entrar</h1>
  <input type="text" id="usuario" placeholder="Usuário">
  <input type="password" id="senha" placeholder="Senha">
  <div id="erroLogin" class="erro"></div>
  <button onclick="entrar()">Entrar</button>
  <button class="secundario" onclick="mostrarCadastro()">Criar Conta</button>
</div>

<!-- TELA CADASTRO -->
<div id="telaCadastro" class="tela">
  <h1>📝 Criar Conta</h1>
  <input type="text" id="novoUsuario" placeholder="Escolha seu usuário">
  <input type="password" id="novaSenha" placeholder="Crie sua senha">
  <input type="password" id="confirmaSenha" placeholder="Repita a senha">
  <div id="erroCadastro" class="erro"></div>
  <button onclick="cadastrar()">Cadastrar</button>
  <button class="secundario" onclick="mostrarLogin()">Voltar</button>
</div>

<!-- TELA INÍCIO -->
<div id="telaInicio" class="tela">
  <h1>🎸 Bem-vindo, <span id="nomeUsuario"></span>!</h1>
  <button onclick="iniciarJogo('normal')">🎮 Modo Normal</button>
  <button class="extremo" onclick="iniciarJogo('extremo')">🔥 Modo Extremo</button>
  <button class="secundario" onclick="sair()">Sair</button>
</div>

<!-- TELA JOGO -->
<div id="telaJogo" class="tela">
  <div class="abas">
    <div class="aba ativa" onclick="trocarAba('jogo')">Jogo</div>
    <div class="aba" onclick="trocarAba('ranking')">Ranking</div>
  </div>

  <div id="abaJogo">
    <div class="placar">
      <div class="caixa"><div>Pontos</div><div id="pontos">0</div></div>
      <div class="caixa"><div>Nível</div><div id="nivel">1</div></div>
      <div class="caixa"><div>Palavras</div><div id="contagem">0/0</div></div>
    </div>
    <div class="grade" id="grade"></div>
    <h3>Palavras:</h3>
    <div class="palavras" id="listaPalavras"></div>
    <br>
    <button onclick="proximoNivel()">Próximo Nível</button>
    <button class="secundario" onclick="voltarInicio()">Voltar</button>
  </div>

  <div id="abaRanking" class="tela">
    <h2>🏆 Ranking</h2>
    <div class="lista-ranking" id="ranking"></div>
    <button class="secundario" onclick="trocarAba('jogo')">Voltar</button>
  </div>
</div>

</div>

<script>
const bancoPalavras = ['LUAN','SANTANA','SERESTA','FORRO','AMOR','CANCAO','VIOLAO','FESTA','BRASIL','ESTRELA','CANTOR','MUSICA','CORACAO','SAUDADE','SONHO','ALEGRIA','BEIJO','FAMILIA','AMIGOS','NOITE','LUA','SOL','ESTRADA','CIDADE','ROCA','CAMPO','FLORES','CANTO','PALCO','FAS','RECORDACAO','DESTINO','CAMINHO','VIDA','ESPERANCA','FELICIDADE','SANFONA','PIANO','GUITARRA','BATERIA','MELODIA','RITMO','REFRAO','BANDA','HISTORIA','LEGENDA','TROFEU','OURO','CEU','MAR','RIO','SERRA','PEDRA','DIAMANTE','BRILHO','FOGO','CORAGEM','HONRA','TESOURO','JOIA','PEROLA','ALMA'];
const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

let usuarioAtual = null, modo = 'normal', nivel = 1, pontos = 0;
let grade = [], selecionadas = [], encontradas = [], palavrasRodada = [];

function carregarContas(){
  const d = localStorage.getItem('contas');
  return d ? JSON.parse(d) : {};
}
function salvarContas(c){
  localStorage.setItem('contas', JSON.stringify(c));
}

function mostrarTela(nome){
  document.querySelectorAll('.tela').forEach(t=>t.classList.remove('ativa'));
  document.getElementById(nome).classList.add('ativa');
}

function mostrarLogin(){ mostrarTela('telaLogin'); }
function mostrarCadastro(){ mostrarTela('telaCadastro'); }

function entrar(){
  const u = document.getElementById('usuario').value.trim();
  const s = document.getElementById('senha').value;
  const contas = carregarContas();
  
  if(!u || !s){
    document.getElementById('erroLogin').textContent = 'Preencha tudo!'; return;
  }
  if(!contas[u]){
    document.getElementById('erroLogin').textContent = 'Usuário não existe. Cadastre-se!'; return;
  }
  if(contas[u].senha !== s){
    document.getElementById('erroLogin').textContent = 'Senha errada!'; return;
  }
  
  usuarioAtual = u;
  document.getElementById('nomeUsuario').textContent = u;
  mostrarTela('telaInicio');
}

function cadastrar(){
  const u = document.getElementById('novoUsuario').value.trim();
  const s = document.getElementById('novaSenha').value;
  const c = document.getElementById('confirmaSenha').value;
  const contas = carregarContas();
  
  if(u.length<3){
    document.getElementById('erroCadastro').textContent = 'Mínimo 3 letras no usuário!'; return;
  }
  if(s.length<4){
    document.getElementById('erroCadastro').textContent = 'Mínimo 4 caracteres na senha!'; return;
  }
  if(s !== c){
    document.getElementById('erroCadastro').textContent = 'Senhas diferentes!'; return;
  }
  if(contas[u]){
    document.getElementById('erroCadastro').textContent = 'Usuário já existe!'; return;
  }
  
  contas[u] = { senha:s, nivelMax:1, pontosTotal:0 };
  salvarContas(contas);
  alert('Conta criada! Faça login!');
  mostrarLogin();
  document.getElementById('usuario').value = u;
}

function sair(){
  if(confirm('Sair?')){
    usuarioAtual = null;
    document.getElementById('usuario').value = '';
    document.getElementById('senha').value = '';
    mostrarLogin();
  }
}

function iniciarJogo(tipo){
  modo = tipo;
  const contas = carregarContas();
  nivel = contas[usuarioAtual].nivelMax;
  pontos = 0;
  encontradas = [];
  mostrarTela('telaJogo');
  iniciarRodada();
}

function configNivel(n){
  return {
    tam: Math.min(10+Math.floor(n/2), modo==='extremo'?16:12),
    qtd: Math.min(6+n, modo==='extremo'?20:12)
  };
}

function iniciarRodada(){
  const cfg = configNivel(nivel);
  selecionadas = []; encontradas = [];
  palavrasRodada = [...bancoPalavras].sort(()=>Math.random()-0.5).slice(0,cfg.qtd);
  grade = Array(cfg.tam).fill().map(()=>Array(cfg.tam).fill(''));
  
  palavrasRodada.forEach(palavra=>{
    let ok=false,t=0;
    while(!ok && t<150){
      const dir=Math.random()>0.5;
      const maxL=cfg.tam-(dir?0:palavra.length);
      const maxC=cfg.tam-(dir?palavra.length:0);
      if(maxL<=0||maxC<=0)break;
      const l=Math.floor(Math.random()*maxL);
      const c=Math.floor(Math.random()*maxC);
      let livre=true;
      for(let i=0;i<palavra.length;i++){
        const nl=dir?l:l+i, nc=dir?c+i:c;
        if(grade[nl][nc] && grade[nl][nc]!==palavra[i]){livre=false;break}
      }
      if(livre){
        for(let i=0;i<palavra.length;i++){
          const nl=dir?l:l+i, nc=dir?c+i:c;
          grade[nl][nc]=palavra[i];
        }
        ok=true;
      }
      t++;
    }
  });
  
  for(let l=0;l<cfg.tam;l++)
    for(let c=0;c<cfg.tam;c++)
      if(!grade[l][c])grade[l][c]=letras[Math.floor(Math.random()*26)];
  
  document.getElementById('nivel').textContent = nivel;
  atualizarPlacar();
  renderizar();
}

function renderizar(){
  const cfg = configNivel(nivel);
  const g = document.getElementById('grade');
  g.style.gridTemplateColumns = `repeat(${cfg.tam},1fr)`;
  g.innerHTML = '';
  
  for(let l=0;l<cfg.tam;l++){
    for(let c=0;c<cfg.tam;c++){
      const d = document.createElement('div');
      d.className = 'casa';
      d.textContent = grade[l][c];
      d.onclick = ()=>clicar(l,c);
      if(selecionadas.some(p=>p.l===l&&p.c===c))d.classList.add('selecionada');
      if(encontradas.some(e=>e.linhas.has(l)&&e.colunas.has(c)))d.classList.add('encontrada');
      g.appendChild(d);
    }
  }
  
  const lista = document.getElementById('listaPalavras');
  lista.innerHTML = '';
  palavrasRodada.forEach(p=>{
    const d=document.createElement('div');
    d.className = 'palavra' + (encontradas.some(e=>e.texto===p)?' encontrada':'');
    d.textContent = p;
    lista.appendChild(d);
  });
}

function atualizarPlacar(){
  document.getElementById('pontos').textContent = pontos;
  document.getElementById('contagem').textContent = `${encontradas.length}/${palavrasRodada.length}`;
}

function clicar(l,c){
  if(encontradas.some(e=>e.linhas.has(l)&&e.colunas.has(c)))return;
  const i = selecionadas.findIndex(p=>p.l===l&&p.c===c);
  if(i>=0){selecionadas.splice(i);renderizar();return}
  selecionadas.push({l,c});
  
  if(selecionadas.length>=2){
    const lin = new Set(selecionadas.map(p=>p.l));
    const col = new Set(selecionadas.map(p=>p.c));
    let txt = '';
    if(lin.size===1){
      selecionadas.sort((a,b)=>a.c-b.c);
      txt = selecionadas.map(p=>grade[p.l][p.c]).join('');
    }else if(col.size===1){
      selecionadas.sort((a,b)=>a.l-b.l);
      txt = selecionadas.map(p=>grade[p.l][p.c]).join('');
    }
    verificar(txt) || verificar(txt.split('').reverse().join(''));
  }
  renderizar();
}

function verificar(palavra){
  if(palavrasRodada.includes(palavra) && !encontradas.some(e=>e.texto===palavra)){
    encontradas.push({
      texto:palavra,
      linhas:new Set(selecionadas.map(p=>p.l)),
      colunas:new Set(selecionadas.map(p=>p.c))
    });
    const ganho = palavra.length * (modo==='extremo'?20:10);
    pontos += ganho;
    selecionadas = [];
    atualizarPlacar();
    
    if(encontradas.length === palavrasRodada.length){
      const contas = carregarContas();
      contas[usuarioAtual].nivelMax = Math.max(contas[usuarioAtual].nivelMax, nivel+1);
      contas[usuarioAtual].pontosTotal += pontos;
      salvarContas(contas);
      alert(`🎉 Nível ${nivel} completo!\nPontos: ${pontos}`);
    }
    return true;
  }
  return false;
}

function proximoNivel(){
  if(encontradas.length < palavrasRodada.length && !confirm('Ainda há palavras! Tem certeza?'))return;
  nivel++; pontos=0; iniciarRodada();
}

function voltarInicio(){
  if(confirm('Voltar ao menu?'))mostrarTela('telaInicio');
}

function trocarAba(nome){
  document.querySelectorAll('.aba').forEach(a=>a.classList.remove('ativa'));
  event.target.classList.add('ativa');
  document.getElementById('abaJogo').style.display = nome==='jogo'?'block':'none';
  document.getElementById('abaRanking').style.display = nome==='ranking'?'block':'none';
  if(nome==='ranking')carregarRanking();
}

function carregarRanking(){
  const contas = carregarContas();
  const rank = Object.entries(contas).map(([n,d])=>({nome:n,pontos:d.pontosTotal})).sort((a,b)=>b.pontos-a.pontos).slice(0,10);
  const el = document.getElementById('ranking');
  el.innerHTML = '';
  if(!rank.length){el.innerHTML='<p style="text-align:center">Jogue para aparecer!</p>';return;}
  rank.forEach((item,idx)=>{
    const d=document.createElement('div');
    d.className='item-ranking';
    d.innerHTML = `<div>${idx+1}º</div><div>${item.nome}</div><div>${item.pontos} pts</div>`;
    el.appendChild(d);
  });
}
</script>
</body>
</html>
