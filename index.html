<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caça-Palavras Luan Santana 💰</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
:root{--dourado:#f2c94c;--vermelho:#d32f2f;--verde:#4caf50;--fundo:#1a1a2e;--fundo2:#16213e}
body{background:linear-gradient(135deg,var(--fundo),var(--fundo2));min-height:100vh;color:#fff;padding:15px}
.container{max-width:720px;margin:0 auto}

/* CABEÇALHO */
.cabecalho{display:flex;justify-content:space-between;align-items:center;padding:15px;background:rgba(0,0,0,0.3);border-radius:12px;margin-bottom:20px}
.perfil{display:flex;align-items:center;gap:10px}
.avatar{width:45px;height:45px;border-radius:50%;background:linear-gradient(135deg,var(--dourado),var(--vermelho));display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px}
.nome-usuario{font-weight:bold;font-size:16px}
.moedas{display:flex;align-items:center;gap:5px;background:rgba(242,201,76,0.15);padding:8px 15px;border-radius:20px}
.icone-moeda{font-size:20px}
.valor-moeda{font-weight:bold;color:var(--dourado);font-size:18px}

/* TELAS */
.tela{background:rgba(0,0,0,0.3);border-radius:16px;padding:25px;margin-bottom:20px;transition:all 0.3s ease}
.escondida{display:none}
h1{text-align:center;color:var(--dourado);margin-bottom:25px;font-size:24px}
h2{color:var(--dourado);margin-bottom:15px;font-size:18px}

/* FORMULÁRIO */
input{width:100%;padding:15px;font-size:18px;border:none;border-radius:10px;background:rgba(255,255,255,0.1);color:#fff;margin-bottom:15px}
button{width:100%;padding:15px;font-size:18px;border:none;border-radius:10px;background:linear-gradient(90deg,var(--dourado),var(--vermelho));color:#000;font-weight:bold;cursor:pointer;transition:transform 0.2s ease}
button:active{transform:scale(0.97)}
.botao-secundario{background:linear-gradient(90deg,#555,#333);color:#fff;margin-top:10px}

/* PLACAR */
.placar{display:flex;justify-content:space-around;text-align:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.caixa-pontos{background:rgba(242,201,76,0.1);padding:12px 20px;border-radius:10px}
.titulo-placar{font-size:14px;opacity:0.7;margin-bottom:5px}
.valor-placar{font-size:22px;font-weight:bold;color:var(--dourado)}

/* GRADE */
.grade{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:20px 0}
.casa{aspect-ratio:1;background:rgba(255,255,255,0.08);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;cursor:pointer;user-select:none;transition:all 0.2s ease}
.casa:hover{background:rgba(255,255,255,0.15)}
.casa.selecionada{background:var(--dourado);color:#000;transform:scale(1.05)}
.casa.encontrada{background:var(--verde);color:#fff}

/* LISTA PALAVRAS */
.palavras{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}
.palavra{padding:10px 15px;background:rgba(255,255,255,0.08);border-radius:8px;font-weight:bold;transition:all 0.3s ease}
.palavra.encontrada{opacity:0.4;text-decoration:line-through;background:rgba(76,175,80,0.2)}

/* RANKING */
.lista-ranking{display:flex;flex-direction:column;gap:8px;margin-top:15px}
.item-ranking{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(255,255,255,0.05);border-radius:8px}
.posicao{width:30px;text-align:center;font-weight:bold}
.posicao-1{color:var(--dourado);font-size:20px}
.posicao-2{color:#c0c0c0}
.posicao-3{color:#cd7f32}
.nome-rank{flex:1;font-weight:bold}
.pontos-rank{color:var(--dourado);font-weight:bold}

/* ABAS */
.abas{display:flex;gap:10px;margin-bottom:20px}
.aba{flex:1;padding:10px;border-radius:8px;background:rgba(255,255,255,0.05);text-align:center;cursor:pointer;font-weight:bold;transition:all 0.2s ease}
.aba.ativa{background:var(--dourado);color:#000}
</style>
</head>
<body>
<div class="container">

<!-- TELA DE ENTRADA -->
<div id="telaEntrada" class="tela">
  <h1>🎸 Caça-Palavras<br>Luan Santana</h1>
  <input type="text" id="nomeJogador" placeholder="Digite seu nome para jogar" autocomplete="off">
  <button onclick="entrarJogo()">Entrar no Jogo 🎮</button>
  <button class="botao-secundario" onclick="mostrarRanking()">🏆 Ver Ranking</button>
</div>

<!-- TELA DO JOGO -->
<div id="telaJogo" class="escondida">
  <div class="cabecalho">
    <div class="perfil">
      <div class="avatar" id="avatar">T</div>
      <div>
        <div class="nome-usuario" id="mostraNome"></div>
        <div style="font-size:12px;opacity:0.7">Nível <span id="nivel">1</span></div>
      </div>
    </div>
    <div class="moedas">
      <span class="icone-moeda">💰</span>
      <span class="valor-moeda" id="mostraMoedas">0</span>
    </div>
  </div>

  <div class="placar">
    <div class="caixa-pontos">
      <div class="titulo-placar">Pontos</div>
      <div class="valor-placar" id="pontos">0</div>
    </div>
    <div class="caixa-pontos">
      <div class="titulo-placar">Palavras</div>
      <div class="valor-placar"><span id="qtdEncontradas">0</span>/<span id="totalPalavras">10</span></div>
    </div>
    <div class="caixa-pontos">
      <div class="titulo-placar">Sequência</div>
      <div class="valor-placar" id="sequencia">🔥 0</div>
    </div>
  </div>

  <div class="grade" id="grade"></div>

  <h3>Palavras a encontrar:</h3>
  <div class="palavras" id="listaPalavras"></div>

  <br>
  <button onclick="reiniciar()">🔄 Novo Jogo</button>
  <button class="botao-secundario" onclick="salvarESair()">💾 Salvar & Sair</button>
</div>

<!-- TELA DE RANKING -->
<div id="telaRanking" class="tela escondida">
  <h1>🏆 Ranking Geral</h1>
  <div class="lista-ranking" id="listaRanking"></div>
  <button class="botao-secundario" onclick="voltarInicio()">⬅️ Voltar</button>
</div>

</div>

<script>
// DADOS DO JOGO
const palavrasLista = [
  'LUAN', 'SANTANA', 'SERESTA', 'FORRO', 'AMOR',
  'CANCAO', 'VIOLAO', 'FESTA', 'BRASIL', 'ESTRELA'
];
const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

let jogador = '';
let pontos = 0;
let moedas = 0;
let nivel = 1;
let sequenciaAtual = 0;
let recordeSequencia = 0;
let grade = [];
let selecionadas = [];
let encontradas = [];
let ranking = [];

// CARREGAR DADOS SALVOS
function carregarDados(){
  const dadosSalvos = localStorage.getItem('dadosJogo');
  if(dadosSalvos){
    const d = JSON.parse(dadosSalvos);
    jogador = d.nome || '';
    moedas = d.moedas || 0;
    ranking = d.ranking || [];
  }
}

// SALVAR DADOS
function salvarDados(){
  localStorage.setItem('dadosJogo', JSON.stringify({
    nome: jogador,
    moedas: moedas,
    ranking: ranking
  }));
}

// ENTRAR NO JOGO
function entrarJogo(){
  const nomeInput = document.getElementById('nomeJogador').value.trim();
  if(!nomeInput){ alert('Digite seu nome para jogar! 🌟'); return; }
  
  jogador = nomeInput;
  carregarDados();
  
  // Se já tinha dados com esse nome
  const dadosSalvos = localStorage.getItem('dadosJogo');
  if(dadosSalvos){
    const d = JSON.parse(dadosSalvos);
    if(d.nome === jogador) moedas = d.moedas || 0;
  }
  
  // Atualiza interface
  document.getElementById('avatar').textContent = jogador[0].toUpperCase();
  document.getElementById('mostraNome').textContent = jogador;
  document.getElementById('mostraMoedas').textContent = moedas;
  
  // Troca de tela
  document.getElementById('telaEntrada').classList.add('escondida');
  document.getElementById('telaRanking').classList.add('escondida');
  document.getElementById('telaJogo').classList.remove('escondida');
  
  iniciarJogo();
}

// INICIAR JOGO
function iniciarJogo(){
  pontos = 0;
  sequenciaAtual = 0;
  encontradas = [];
  selecionadas = [];
  nivel = Math.floor(moedas / 100) + 1;
  
  atualizarPlacar();
  document.getElementById('nivel').textContent = nivel;
  
  grade = Array(10).fill().map(()=>Array(10).fill(''));
  
  // COLOCAR PALAVRAS
  palavrasLista.forEach(palavra => {
    let colocada = false, tentativas = 0;
    while(!colocada && tentativas < 100){
      const direcao = Math.random() > 0.5; // true = horizontal, false = vertical
      const maxLinha = 10 - (direcao ? 0 : palavra.length);
      const maxColuna = 10 - (direcao ? palavra.length : 0);
      const lin = Math.floor(Math.random() * maxLinha);
      const col = Math.floor(Math.random() * maxColuna);
      
      let cabe = true;
      for(let i=0; i<palavra.length; i++){
        const l = direcao ? lin : lin + i;
        const c = direcao ? col + i : col;
        if(grade[l][c] && grade[l][c] !== palavra[i]){
          cabe = false;
          break;
        }
      }
      
      if(cabe){
        for(let i=0; i<palavra.length; i++){
          const l = direcao ? lin : lin + i;
          const c = direcao ? col + i : col;
          grade[l][c] = palavra[i];
        }
        colocada = true;
      }
      tentativas++;
    }
  });
  
  // PREENCHER LETRAS ALEATÓRIAS
  for(let l=0; l<10; l++){
    for(let c=0; c<10; c++){
      if(!grade[l][c]){
        grade[l][c] = letras[Math.floor(Math.random() * 26)];
      }
    }
  }
  
  renderizar();
}

// RENDERIZAR TELA
function renderizar(){
  // GRADE
  const gradeEl = document.getElementById('grade');
  gradeEl.innerHTML = '';
  for(let l=0; l<10; l++){
    for(let c=0; c<10; c++){
      const div = document.createElement('div');
      div.className = 'casa';
      div.textContent = grade[l][c];
      div.onclick = () => clicarCasa(l, c);
      
      if(selecionadas.some(p => p.l === l && p.c === c)){
        div.classList.add('selecionada');
      }
      if(encontradas.some(e => e.linhas.has(l) && e.colunas.has(c))){
        div.classList.add('encontrada');
      }
      gradeEl.appendChild(div);
    }
  }
  
  // LISTA PALAVRAS
  const listaEl = document.getElementById('listaPalavras');
  listaEl.innerHTML = '';
  palavrasLista.forEach(palavra => {
    const div = document.createElement('div');
    div.className = 'palavra' + (encontradas.some(e => e.texto === palavra) ? ' encontrada' : '');
    div.textContent = palavra;
    listaEl.appendChild(div);
  });
  
  atualizarPlacar();
}

// ATUALIZAR PLACAR
function atualizarPlacar(){
  document.getElementById('pontos').textContent = pontos;
  document.getElementById('qtdEncontradas').textContent = encontradas.length;
  document.getElementById('totalPalavras').textContent = palavrasLista.length;
  document.getElementById('sequencia').textContent = '🔥 ' + sequenciaAtual;
  document.getElementById('mostraMoedas').textContent = moedas;
}

// CLICAR NA CASA
function clicarCasa(l, c){
  // Se já foi encontrada, ignora
  if(encontradas.some(e => e.linhas.has(l) && e.colunas.has(c))) return;
  
  // Remove se já estava selecionada
  const idx = selecionadas.findIndex(p => p.l === l && p.c === c);
  if(idx >= 0){
    selecionadas.splice(idx, 1);
    renderizar();
    return;
  }
  
  selecionadas.push({l, c});
  
  // Tenta formar palavra
  if(selecionadas.length >= 2){
    const linhas = new Set(selecionadas.map(p => p.l));
    const colunas = new Set(selecionadas.map(p => p.c));
    let texto = '';
    
    if(linhas.size === 1){
      selecionadas.sort((a, b) => a.c - b.c);
      texto = selecionadas.map(p => grade[p.l][p.c]).join('');
    } else if(colunas.size === 1){
      selecionadas.sort((a, b) => a.l - b.l);
      texto = selecionadas.map(p => grade[p.l][p.c]).join('');
    }
    
    const invertido = texto.split('').reverse().join('');
    
    verificarPalavra(texto) || verificarPalavra(invertido);
  }
  
  renderizar();
}

// VERIFICAR PALAVRA
function verificarPalavra(texto){
  if(palavrasLista.includes(texto) && !encontradas.some(e => e.texto === texto)){
    encontradas.push({
      texto: texto,
      linhas: new Set(selecionadas.map(p => p.l)),
      colunas: new Set(selecionadas.map(p => p.c))
    });
    
    // PONTOS E MOEDAS
    const pontosGanho = texto.length * 10;
    const moedasGanho = Math.floor(pontosGanho / 5);
    sequenciaAtual++;
    if(sequenciaAtual > recordeSequencia) recordeSequencia = sequenciaAtual;
    
    pontos += pontosGanho;
    moedas += moedasGanho;
    
    // BÔNUS TODAS ENCONTRADAS
    if(encontradas.length === palavrasLista.length){
      moedas += 50;
      salvarJogoNoRanking();
      setTimeout(() => {
        alert(`🎉 PARABÉNS ${jogador}!\n\nPontos: ${pontos}\nMoedas: +50 💰\nSequência: ${sequenciaAtual} 🔥\n\nJogo salvo no Ranking!`);
      }, 400);
    }
    
    selecionadas = [];
    salvarDados();
    return true;
  }
  return false;
}

// SALVAR NO RANKING
function salvarJogoNoRanking(){
  // Remove entrada antiga do mesmo jogador
  ranking = ranking.filter(r => r.nome !== jogador);
  // Adiciona nova
  ranking.push({
    nome: jogador,
    pontos: pontos,
    data: new Date().toLocaleDateString('pt-BR')
  });
  // Ordena por pontos
  ranking.sort((a, b) => b.pontos - a.pontos);
  // Mantém só top 10
  ranking = ranking.slice(0, 10);
  salvarDados();
}

// MOSTRAR RANKING
function mostrarRanking(){
  carregarDados();
  
  document.getElementById('telaEntrada').classList.add('escondida');
  document.getElementById('telaJogo').classList.add('escondida');
  document.getElementById('telaRanking').classList.remove('escondida');
  
  const listaEl = document.getElementById('listaRanking');
  listaEl.innerHTML = '';
  
  if(ranking.length === 0){
    listaEl.innerHTML = '<p style="text-align:center;opacity:0.7">Nenhum jogo salvo ainda. Jogue para aparecer! 🎮</p>';
    return;
  }
  
  ranking.forEach((item, indice) => {
    const div = document.createElement('div');
    div.className = 'item-ranking';
    
    let classePosicao = '';
    if(indice === 0) classePosicao = 'posicao-1';
    else if(indice === 1) classePosicao = 'posicao-2';
    else if(indice === 2) classePosicao = 'posicao-3';
    
    div.innerHTML = `
      <div class="posicao ${classePosicao}">${indice + 1}º</div>
      <div class="nome-rank">${item.nome}</div>
      <div class="pontos-rank">${item.pontos} pts</div>
    `;
    listaEl.appendChild(div);
  });
}

// SALVAR E SAIR
function salvarESair(){
  salvarDados();
  alert('✅ Progresso salvo!');
  voltarInicio();
}

// VOLTAR AO INÍCIO
function voltarInicio(){
  document.getElementById('telaEntrada').classList.remove('escondida');
  document.getElementById('telaJogo').classList.add('escondida');
  document.getElementById('telaRanking').classList.add('escondida');
  document.getElementById('nomeJogador').value = jogador;
}

// REINICIAR JOGO
function reiniciar(){
  if(encontradas.length > 0 && !confirm('Começar novo jogo? O progresso atual será salvo no ranking.')) return;
  selecionadas = [];
  iniciarJogo();
}
</script>
</body>
</html>
