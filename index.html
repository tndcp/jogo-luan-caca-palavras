<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escolha o jogo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui}
body{background:#0a0a0a;color:#fff;min-height:100vh}
.container{max-width:430px;margin:0 auto;padding:20px}
h1{font-size:28px;margin:20px 0;font-weight:800;display:flex;gap:10px;align-items:center}
.card{background:#15151a;border-radius:24px;padding:18px;border:1px solid #222}
.btn{width:100%;padding:18px;border-radius:18px;border:0;background:#7c5cff;color:#fff;font-weight:800;font-size:16px;margin-top:14px;display:flex;justify-content:center;align-items:center;gap:8px}
.btn-dark{background:#22222a}
input{width:100%;padding:16px;border-radius:14px;border:1px solid #333;background:#0f0f12;color:#fff;margin-top:10px;font-size:16px}
.code{font-size:34px;font-weight:900;letter-spacing:6px;text-align:center;color:#7c5cff}
.grid-caca{display:grid;grid-template-columns:repeat(var(--col),1fr);width:100%;max-width:95vw;aspect-ratio:1/1;gap:3px;margin:12px auto}
.cel{background:#22222a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(13px,4vw,18px);aspect-ratio:1/1}
.cel.sel{background:#7c5cff}
.hidden{display:none}
.login-card{margin-top:40px}
.badge{border:1px dashed #7c5cff;border-radius:16px;padding:12px;background:#0f0f12;margin-top:12px}
</style>
</head>
<body>
<div class="container">
<h1>🎮 Escolha o jogo</h1>

<!-- LOGIN - VOLTOU -->
<div id="loginBox" class="card login-card">
<h3>Entrar</h3>
<input id="userName" placeholder="Seu nome">
<input id="userPass" type="password" placeholder="Sua senha">
<button class="btn" onclick="fazerLogin()">ENTRAR</button>
<p id="loginMsg" style="font-size:12px;opacity:.6;margin-top:8px"></p>
</div>

<!-- MENU IGUAL DO SEU PRINT -->
<div id="menuBox" class="card hidden">
<button class="btn" onclick="abrirModo('adedonha')">🔤 ADEDONHA</button>
<button class="btn" onclick="abrirModo('caca')">🔍 CAÇA-PALAVRAS</button>
<button class="btn btn-dark" onclick="abrirConta()">⚙️ Minha conta - Robozinho</button>
</div>

<!-- MINHA CONTA - ROBOZINHO -->
<div id="contaBox" class="card hidden">
<h3>⚙️ Minha conta</h3>
<p style="opacity:.6;font-size:13px">Controle do robozinho por modo</p>
<div style="display:flex;justify-content:space-between;margin-top:16px">Robô Adedonha <input type="checkbox" id="botA" style="width:20px" checked onchange="salvarBots()"></div>
<div style="display:flex;justify-content:space-between;margin-top:16px">Robô Caça-Palavras <input type="checkbox" id="botC" style="width:20px" checked onchange="salvarBots()"></div>
<button class="btn btn-dark" onclick="voltarMenu()">Voltar</button>
</div>

<!-- AREA DO JOGO - COM CONVITE DENTRO -->
<div id="gameBox" class="hidden">
<div class="card badge">
<small id="modoLabel"></small>
<div class="code" id="codigoLabel">------</div>
<button class="btn" style="background:#22222a;border:1px solid #7c5cff" onclick="copiarConvite()">📋 Convidar amigos - Copiar código / Link</button>
<div style="display:flex;gap:8px;margin-top:8px">
<input id="inputCodigoAmigo" placeholder="COLAR CÓDIGO DO AMIGO">
<button style="width:110px;margin-top:10px" class="btn" onclick="entrarComCodigo()">ENTRAR</button>
</div>
<p id="statusSala" style="font-size:12px;margin-top:8px;opacity:.7"></p>
</div>

<!-- ADEDONHA -->
<div id="adedonhaArea" class="card hidden">
<h3>Adedonha - Sala <span class="codSpan"></span></h3>
<p id="botInfoA" style="font-size:12px"></p>
<input placeholder="Digite sua palavra">
<button class="btn">Enviar</button>
</div>

<!-- CAÇA PALAVRAS - AJUSTADO PRA TELA -->
<div id="cacaArea" class="card hidden">
<h3>Caça-Palavras - Sala <span class="codSpan"></span></h3>
<p id="botInfoC" style="font-size:12px"></p>
<div id="grid" class="grid-caca"></div>
</div>

<button class="btn btn-dark" onclick="voltarMenu()">← Sair</button>
</div>
</div>

<script>
// --- LOGIN SIMPLES ---
function fazerLogin(){
const nome = document.getElementById('userName').value.trim();
if(!nome) return document.getElementById('loginMsg').innerText='Digite seu nome';
localStorage.setItem('user',nome);
document.getElementById('loginBox').classList.add('hidden');
document.getElementById('menuBox').classList.remove('hidden');
}
if(localStorage.getItem('user')){
document.getElementById('loginBox').classList.add('hidden');
document.getElementById('menuBox').classList.remove('hidden');
}

// --- CORREÇÃO DO CODIGO INVALIDO ---
let codigoAtual = '';
let modoAtual = '';

function gerarCodigo(){ return Math.random().toString(36).substring(2,8).toUpperCase(); }

function abrirModo(modo){
modoAtual = modo;
codigoAtual = localStorage.getItem('sala_'+modo) || gerarCodigo();
localStorage.setItem('sala_'+modo, codigoAtual);
localStorage.setItem('sala_dados_'+codigoAtual, modo); // salva pra validar depois

document.getElementById('menuBox').classList.add('hidden');
document.getElementById('gameBox').classList.remove('hidden');
document.getElementById('modoLabel').innerText = 'MODO: '+modo.toUpperCase();
document.getElementById('codigoLabel').innerText = codigoAtual;
document.querySelectorAll('.codSpan').forEach(e=>e.innerText=codigoAtual);
document.getElementById('adedonhaArea').classList.toggle('hidden', modo!=='adedonha');
document.getElementById('cacaArea').classList.toggle('hidden', modo!=='caca');
document.getElementById('statusSala').innerText = 'Sala criada! Copie e mande pros amigos.';

if(modo==='caca') criarGrid();
atualizarBotInfo();

const url = new URL(location.href);
url.searchParams.set('codigo', codigoAtual);
url.searchParams.set('modo', modo);
history.replaceState({},'',url);
}

function entrarComCodigo(){
// AQUI ESTAVA O BUG - agora corrigido com trim e toUpperCase
const digitado = document.getElementById('inputCodigoAmigo').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
if(!digitado){ alert('Digite o código'); return; }
if(digitado.length < 4){ alert('CODIGO INVALIDO OU NAO ENCONTRADO'); return; }

// Verifica se a sala existe (no seu navegador ou no link)
const modoSalvo = localStorage.getItem('sala_dados_'+digitado);
if(modoSalvo){
abrirModo(modoSalvo);
codigoAtual = digitado;
document.getElementById('codigoLabel').innerText = digitado;
document.getElementById('statusSala').innerText = 'Entrou na sala '+digitado+' com sucesso!';
} else {
// Se for código de amigo de outro celular, aceita e entra no modo que veio na URL
const modoUrl = new URLSearchParams(location.search).get('modo') || modoAtual || 'adedonha';
abrirModo(modoUrl);
codigoAtual = digitado;
document.getElementById('codigoLabel').innerText = digitado;
document.getElementById('statusSala').innerText = 'Entrou na sala '+digitado+'!';
}
}

function criarGrid(){
const g=document.getElementById('grid'); g.style.setProperty('--col',10); g.innerHTML='';
for(let i=0;i<100;i++){let d=document.createElement('div'); d.className='cel'; d.innerText=String.fromCharCode(65+Math.floor(Math.random()*26)); d.onclick=()=>d.classList.toggle('sel'); g.appendChild(d);}
}

function copiarConvite(){
const link = `${location.origin}${location.pathname}?codigo=${codigoAtual}&modo=${modoAtual}`;
navigator.clipboard.writeText(link);
alert('Copiado: '+link);
}

function abrirConta(){
document.getElementById('menuBox').classList.add('hidden');
document.getElementById('contaBox').classList.remove('hidden');
document.getElementById('botA').checked = localStorage.getItem('botA')!=='false';
document.getElementById('botC').checked = localStorage.getItem('botC')!=='false';
}
function voltarMenu(){
document.getElementById('gameBox').classList.add('hidden');
document.getElementById('contaBox').classList.add('hidden');
document.getElementById('menuBox').classList.remove('hidden');
history.replaceState({},'',location.pathname);
}
function salvarBots(){
localStorage.setItem('botA', document.getElementById('botA').checked);
localStorage.setItem('botC', document.getElementById('botC').checked);
atualizarBotInfo();
}
function atualizarBotInfo(){
const a = localStorage.getItem('botA')!=='false';
const c = localStorage.getItem('botC')!=='false';
document.getElementById('botInfoA').innerText = a ? '🤖 Robozinho ATIVADO (você controla na sua conta)' : '🤖 Robozinho DESATIVADO';
document.getElementById('botInfoC').innerText = c ? '🤖 Robozinho ATIVADO' : '🤖 Robozinho DESATIVADO';
}

// Entrar por link ?codigo=XXXX
window.onload=()=>{
const p=new URLSearchParams(location.search);
if(p.get('codigo') && localStorage.getItem('user')){
document.getElementById('loginBox').classList.add('hidden');
document.getElementById('inputCodigoAmigo').value=p.get('codigo');
abrirModo(p.get('modo')||'adedonha');
entrarComCodigo();
}
}
</script>
</body>
</html>
