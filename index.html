<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan Coins 💰</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#1a1a2e;color:#fff;min-height:100vh;padding:20px}
.container{max-width:460px;margin:0 auto}
h1{text-align:center;color:#ffd700;margin:30px 0}
.tela{display:none}
.tela.ativa{display:block}
input{width:100%;padding:15px;font-size:16px;border:none;border-radius:12px;background:#2a2a4e;color:#fff;margin-bottom:12px}
button{width:100%;padding:15px;font-size:16px;border:none;border-radius:12px;font-weight:bold;cursor:pointer;margin:8px 0}
button.primario{background:#ffd700;color:#000}
button.secundario{background:#374;color:#fff}
.erro{color:#f66;text-align:center;margin:10px 0;min-height:24px}
</style>
</head>
<body>
<div class="container">

<div id="telaLogin" class="tela ativa">
  <h1>🎸 Luan Coins 💰</h1>
  <input type="text" id="usuario" placeholder="Seu nome de usuário">
  <input type="password" id="senha" placeholder="Sua senha">
  <div id="erroLogin" class="erro"></div>
  <button class="primario" id="btnEntrar">🎵 Entrar</button>
  <button class="secundario" id="btnCadLink">📝 Criar Conta</button>
</div>

<div id="telaCadastro" class="tela">
  <h1>📝 Nova Conta</h1>
  <input type="text" id="novoUsuario" placeholder="Escolha seu nome">
  <input type="password" id="novaSenha" placeholder="Crie uma senha">
  <input type="password" id="confirmaSenha" placeholder="Repita a senha">
  <div id="erroCadastro" class="erro"></div>
  <button class="primario" id="btnCadastrar">✅ Cadastrar</button>
  <button class="secundario" id="btnVoltarLogin">← Voltar</button>
</div>

<div id="telaInicio" class="tela">
  <h1>Bem-vindo, <span id="nomeUsuario"></span>!</h1>
  <p style="text-align:center;margin:20px 0">Funcionando! ✅</p>
  <button class="secundario" id="btnSair">🚪 Sair</button>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAkZYDcCsua7qzmdZDj__KIrYTAWIslvsI",
  authDomain: "luan-coins.firebaseapp.com",
  databaseURL: "https://luan-coins-default-rtdb.firebaseio.com",
  projectId: "luan-coins",
  storageBucket: "luan-coins.firebasestorage.app",
  messagingSenderId: "379641584803",
  appId: "1:379641584803:web:c1bfc0c0715e3347fef316"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const refContas = db.ref('contas');

let usuarioAtual = null;

function mostrarTela(id){
  document.querySelectorAll('.tela').forEach(t=>t.classList.remove('ativa'));
  document.getElementById(id).classList.add('ativa');
}

async function entrar(){
  const u = document.getElementById('usuario').value.trim();
  const s = document.getElementById('senha').value;
  const erro = document.getElementById('erroLogin');
  if(!u||!s){erro.textContent='Preencha tudo!';return;}
  const snap = await refContas.child(u).once('value');
  if(!snap.exists()){erro.textContent='Usuário não existe! Crie conta.';return;}
  if(snap.val().senha !== s){erro.textContent='Senha errada!';return;}
  usuarioAtual = u;
  document.getElementById('nomeUsuario').textContent = u;
  erro.textContent='';
  mostrarTela('telaInicio');
}

async function cadastrar(){
  const u = document.getElementById('novoUsuario').value.trim();
  const s = document.getElementById('novaSenha').value;
  const c = document.getElementById('confirmaSenha').value;
  const erro = document.getElementById('erroCadastro');
  if(u.length<3){erro.textContent='Mínimo 3 letras!';return;}
  if(s.length<4){erro.textContent='Mínimo 4 caracteres!';return;}
  if(s!==c){erro.textContent='Senhas diferentes!';return;}
  if((await refContas.child(u).once('value')).exists()){erro.textContent='Nome já existe!';return;}
  await refContas.child(u).set({senha:s,moedas:50});
  alert('✅ Conta criada! Faça login!');
  mostrarTela('telaLogin');
  document.getElementById('usuario').value = u;
}

function sair(){
  usuarioAtual = null;
  mostrarTela('telaLogin');
}

// LIGA OS BOTÕES — NÃO MEXER AQUI
document.addEventListener('DOMContentLoaded', function(){
  console.log('Página carregada!');
  document.getElementById('btnEntrar').addEventListener('click', entrar);
  document.getElementById('btnCadLink').addEventListener('click', ()=>mostrarTela('telaCadastro'));
  document.getElementById('btnVoltarLogin').addEventListener('click', ()=>mostrarTela('telaLogin'));
  document.getElementById('btnCadastrar').addEventListener('click', cadastrar);
  document.getElementById('btnSair').addEventListener('click', sair);
});
</script>
</body>
</html>
