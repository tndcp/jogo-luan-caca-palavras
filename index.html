<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caça-Palavras Luan Santana</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
    body{background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;color:#fff;padding:20px}
    .container{max-width:700px;margin:0 auto}
    h1{text-align:center;color:#f2c94c;margin-bottom:20px;font-size:24px}
    .tela{background:rgba(0,0,0,0.3);border-radius:16px;padding:30px;margin-bottom:20px}
    .escondida{display:none}
    input{width:100%;padding:14px;font-size:18px;border:none;border-radius:10px;background:rgba(255,255,255,0.1);color:#fff;margin-bottom:15px}
    button{width:100%;padding:14px;font-size:18px;border:none;border-radius:10px;background:linear-gradient(90deg,#f2c94c,#d32f2f);color:#000;font-weight:bold;cursor:pointer}
    .grade{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:20px 0}
    .casa{aspect-ratio:1;background:rgba(255,255,255,0.1);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;user-select:none}
    .casa.selecionada{background:#f2c94c;color:#000}
    .casa.encontrada{background:#4caf50;color:#fff}
    .palavras{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
    .palavra{padding:8px 12px;background:rgba(255,255,255,0.1);border-radius:8px}
    .palavra.encontrada{opacity:0.5;text-decoration:line-through}
    .placar{text-align:center;font-size:20px;margin-bottom:15px;color:#f2c94c}
  </style>
</head>
<body>
<div class="container">

  <!-- TELA DE ENTRADA -->
  <div id="telaEntrada" class="tela">
    <h1>🎸 Caça-Palavras<br>Luan Santana</h1>
    <input type="text" id="nomeJogador" placeholder="Digite seu nome" autocomplete="off">
    <button onclick="entrarJogo()">Entrar no Jogo 🎮</button>
  </div>

  <!-- TELA DO JOGO -->
  <div id="telaJogo" class="tela escondida">
    <h1>🎸 Olá, <span id="mostraNome"></span>!</h1>
    <div class="placar">Pontos: <span id="pontos">0</span></div>
    <div class="grade" id="grade"></div>
    <h3>Palavras a encontrar:</h3>
    <div class="palavras" id="listaPalavras"></div>
    <br>
    <button onclick="reiniciar()">🔄 Novo Jogo</button>
  </div>

</div>

<script>
const gradeEl = document.getElementById('grade');
const listaPalavrasEl = document.getElementById('listaPalavras');
const pontosEl = document.getElementById('pontos');
const mostraNomeEl = document.getElementById('mostraNome');

const palavrasLista = [
  'LUAN', 'SANTANA', 'SERESTA', 'FORRO', 'AMOR',
  'CANCAO', 'VIOLAO', 'FESTA', 'BRASIL', 'ESTRELA'
];

let grade = [];
let selecionadas = [];
let palavrasEncontradas = [];
let pontos = 0;
let jogador = '';

const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

function entrarJogo(){
  jogador = document.getElementById('nomeJogador').value.trim();
  if(!jogador){ alert('Digite seu nome!'); return; }
  document.getElementById('telaEntrada').classList.add('escondida');
  document.getElementById('telaJogo').classList.remove('escondida');
  mostraNomeEl.textContent = jogador;
  iniciarJogo();
}

function iniciarJogo(){
  pontos = 0;
  pontosEl.textContent = pontos;
  palavrasEncontradas = [];
  selecionadas = [];
  grade = Array(10).fill().map(()=>Array(10).fill(''));
  
  palavrasLista.forEach(palavra => {
    let colocada = false, tentativas = 0;
    while(!colocada && tentativas < 100){
      let dir = Math.random() > 0.5;
      let lin = Math.floor(Math.random()*(10 - (dir ? 0 : palavra.length)));
      let col = Math.floor(Math.random()*(10 - (dir ? palavra.length : 0)));
      let ok = true;
      for(let i=0; i<palavra.length; i++){
        let l = dir ? lin : lin+i;
        let c = dir ? col+i : col;
        if(grade[l][c] && grade[l][c] !== palavra[i]){ ok = false; break; }
      }
      if(ok){
        for(let i=0; i<palavra.length; i++){
          let l = dir ? lin : lin+i;
          let c = dir ? col+i : col;
          grade[l][c] = palavra[i];
        }
        colocada = true;
      }
      tentativas++;
    }
  });
  
  for(let l=0; l<10; l++)
    for(let c=0; c<10; c++)
      if(!grade[l][c]) grade[l][c] = letras[Math.floor(Math.random()*letras.length)];
  
  renderizar();
}

function renderizar(){
  gradeEl.innerHTML = '';
  for(let l=0; l<10; l++){
    for(let c=0; c<10; c++){
      const div = document.createElement('div');
      div.className = 'casa';
      div.textContent = grade[l][c];
      div.onclick = () => clicarCasa(l,c);
      if(selecionadas.some(p => p.l===l && p.c===c)) div.classList.add('selecionada');
      gradeEl.appendChild(div);
    }
  }
  
  listaPalavrasEl.innerHTML = '';
  palavrasLista.forEach(p => {
    const div = document.createElement('div');
    div.className = 'palavra' + (palavrasEncontradas.includes(p) ? ' encontrada' : '');
    div.textContent = p;
    listaPalavrasEl.appendChild(div);
  });
}

function clicarCasa(l,c){
  const idx = selecionadas.findIndex(p => p.l===l && p.c===c);
  if(idx >= 0){ selecionadas.splice(idx); renderizar(); return; }
  selecionadas.push({l,c});
  
  if(selecionadas.length >= 2){
    const linhas = [...new Set(selecionadas.map(p => p.l))];
    const cols = [...new Set(selecionadas.map(p => p.c))];
    let texto = '';
    if(linhas.length === 1){
      selecionadas.sort((a,b)=>a.c-b.c);
      texto = selecionadas.map(p => grade[p.l][p.c]).join('');
    } else if(cols.length === 1){
      selecionadas.sort((a,b)=>a.l-b.l);
      texto = selecionadas.map(p => grade[p.l][p.c]).join('');
    }
    const rev = texto.split('').reverse().join('');
    if(palavrasLista.includes(texto) && !palavrasEncontradas.includes(texto)){
      palavrasEncontradas.push(texto);
      pontos += texto.length * 10;
      pontosEl.textContent = pontos;
      marcarEncontrada();
    } else if(palavrasLista.includes(rev) && !palavrasEncontradas.includes(rev)){
      palavrasEncontradas.push(rev);
      pontos += rev.length * 10;
      pontosEl.textContent = pontos;
      marcarEncontrada();
    }
  }
  renderizar();
}

function marcarEncontrada(){
  selecionadas.forEach(p => {
    document.querySelector(`.casa:nth-child(${p.l*10+p.c+1})`).classList.add('encontrada');
  });
  selecionadas = [];
  if(palavrasEncontradas.length === palavrasLista.length){
    setTimeout(()=>alert(`🎉 Parabéns ${jogador}! Você encontrou TODAS as palavras!\nPontos: ${pontos}`), 300);
  }
}

function reiniciar(){
  selecionadas = [];
  iniciarJogo();
}
</script>
</body>
</html>
