<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo do Luan Santana</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f0f0f0; }
    .container { margin: 20px auto; width: 80%; max-width: 600px; background: #fff; padding: 20px; border-radius: 10px; }
    h1 { color: #2c3e50; }
    button { margin: 10px; padding: 10px 20px; border: none; border-radius: 5px; background: #3498db; color: white; cursor: pointer; }
    button:hover { background: #2980b9; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎶 Jogo do Luan Santana 🎶</h1>

    <!-- Painel de Login -->
    <div id="loginPanel">
      <h2>Login</h2>
      <input type="text" id="username" placeholder="Usuário"><br><br>
      <input type="password" id="password" placeholder="Senha"><br><br>
      <button onclick="login()">Entrar</button>
    </div>

    <!-- Menu de Jogos -->
    <div id="gameMenu" class="hidden">
      <h2>Escolha o modo de jogo</h2>
      <button onclick="startWordSearch()">Caça-palavras Profissional</button>
      <button onclick="startAdedonha()">Adedonha Stop</button>
      <button onclick="startOnline()">Modo Online</button>
    </div>

    <!-- Área de Jogo -->
    <div id="gameArea" class="hidden">
      <h2 id="gameTitle"></h2>
      <p id="gameContent">Aqui vai aparecer o jogo...</p>
    </div>
  </div>

  <script>
    function login() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      // Login fictício apenas para demonstração
      if(user === "Thiago Shelby" && pass === "9090iop") {
        alert("Login bem-sucedido!");
        document.getElementById('loginPanel').classList.add('hidden');
        document.getElementById('gameMenu').classList.remove('hidden');
      } else {
        alert("Usuário ou senha incorretos.");
      }
    }

    function startWordSearch() {
      document.getElementById('gameTitle').innerText = "Caça-palavras Profissional";
      document.getElementById('gameContent').innerText = "Aqui você vai montar um caça-palavras com palavras relacionadas ao Luan Santana.";
      document.getElementById('gameArea').classList.remove('hidden');
    }

    function startAdedonha() {
      document.getElementById('gameTitle').innerText = "Adedonha Stop";
      document.getElementById('gameContent').innerText = "Modo clássico e profissional de Adedonha. Mínimo 2 jogadores, máximo 6.";
      document.getElementById('gameArea').classList.remove('hidden');
    }

    function startOnline() {
      document.getElementById('gameTitle').innerText = "Modo Online";
      document.getElementById('gameContent').innerText = "Convide amigos por código para jogar juntos.";
      document.getElementById('gameArea').classList.remove('hidden');
    }
  </script>
</body>
</html>
