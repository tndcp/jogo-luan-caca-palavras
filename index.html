<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan Santana - Game Oficial | Caça Palavras & Stop</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff2e7a;--purple:#7b2cff;--dark:#0f0f1a;--card:#1c1c2e;--gold:#ffcc00}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif}
body{background:linear-gradient(135deg,#0f0f1a 0%,#1a1033 100%);color:#fff;min-height:100vh}
.hidden{display:none!important}
header{padding:20px;text-align:center;border-bottom:1px solid #ffffff1a}
header h1{font-family:'Bebas Neue';font-size:42px;letter-spacing:3px;background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{background:linear-gradient(90deg,var(--pink),var(--purple));border:none;padding:12px 24px;border-radius:30px;color:#fff;font-weight:800;cursor:pointer;transition:.2s;text-transform:uppercase}
.btn:hover{transform:scale(1.05);box-shadow:0 0 20px var(--pink)}
.card{background:var(--card);border-radius:20px;padding:24px;border:1px solid #ffffff14;box-shadow:0 10px 30px #0006}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff2a;background:#0004;color:#fff;margin:8px 0;outline:none}
input:focus{border-color:var(--pink)}
#auth{max-width:420px;margin:40px auto}
.tabs{display:flex;gap:10px;margin:20px 0}
.tab{flex:1;padding:10px;border-radius:10px;background:#ffffff0f;cursor:pointer;text-align:center;font-weight:600}
.tab.active{background:var(--pink)}
#lobby{max-width:900px;margin:30px auto;padding:20px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:20px}
.mode-card{cursor:pointer;transition:.3s;position:relative;overflow:hidden}
.mode-card:hover{transform:translateY(-5px)}
.mode-card h3{font-family:'Bebas Neue';font-size:28px}
.badge{position:absolute;top:10px;right:10px;background:var(--gold);color:#000;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}
#gameArea{max-width:1100px;margin:20px auto;padding:15px}
#wordGrid{display:grid;gap:2px;user-select:none;touch-action:none}
.cell{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#ffffff0a;border-radius:6px;font-weight:800;cursor:pointer;font-size:14px}
.cell.selected{background:var(--pink)!important}
.cell.found{background:var(--gold)!important;color:#000!important}
.wordList{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
.wordChip{padding:6px 12px;background:#ffffff12;border-radius:20px;font-size:12px;font-weight:600}
.wordChip.done{text-decoration:line-through;background:var(--gold);color:#000}
#stopArea{display:grid;grid-template-columns:1fr 300px;gap:20px}
@media(max-width:800px){#stopArea{grid-template-columns:1fr}}
.stop-input{margin-bottom:12px}
.stop-input label{font-size:12px;color:#aaa;text-transform:uppercase;font-weight:700}
.timer{font-family:'Bebas Neue';font-size:48px;text-align:center;color:var(--gold)}
.roomCode{font-size:28px;letter-spacing:6px;background:#0006;padding:10px 20px;border-radius:12px;border:2px dashed var(--pink);text-align:center;font-weight:800}
.online-players{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:6px 12px;background:#ffffff15;border-radius:20px;font-size:13px}
.bot-indicator{font-size:11px;color:var(--gold);display:none}
</style>
</head>
<body>
<header>
<h1>LUAN SANTANA GAME</h1>
<p style="opacity:.6;font-size:12px;letter-spacing:2px">CAÇA PALAVRAS + ADEDONHA OFICIAL - V2 FIX</p>
</header>

<div id="auth">
<div class="card">
<div class="tabs"><div class="tab active" id="tabLogin" onclick="switchAuth('login')">LOGIN</div><div class="tab" id="tabReg" onclick="switchAuth('register')">CRIAR CONTA</div></div>
<div id="loginForm">
<input id="loginUser" placeholder="Usuário - ex: Thiago Shelby">
<input id="loginPass" type="password" placeholder="Senha - ex: 9090iop">
<button class="btn" style="width:100%;margin-top:12px" onclick="login()">ENTRAR</button>
<p style="font-size:11px;opacity:.7;margin-top:12px;text-align:center;line-height:1.4">Sua conta mestre é:<br><b style="color:var(--gold)">Thiago Shelby / 9090iop</b><br>Login sem diferenciar maiúscula/minúscula</p>
<button onclick="clearCache()" style="margin-top:15px;background:none;border:1px solid #ffffff2a;color:#aaa;padding:8px 12px;border-radius:20px;font-size:11px;cursor:pointer;width:100%">⚠️ Se não entrar, clique aqui para limpar cache e corrigir</button>
</div>
<div id="registerForm" class="hidden">
<input id="regUser" placeholder="Crie seu usuário">
<input id="regPass" type="password" placeholder="Crie sua senha">
<button class="btn" style="width:100%;margin-top:12px" onclick="register()">CRIAR CONTA</button>
</div>
<p id="authMsg" style="margin-top:12px;text-align:center;font-size:13px;color:var(--gold)"></p>
</div>
</div>

<div id="lobby" class="hidden">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
<h2 style="font-family:'Bebas Neue';font-size:32px">Olá, <span id="userNameDisplay"></span> <span id="botTag" class="bot-indicator">🤖 MODO SHELBY ATIVO</span></h2>
<button class="btn" onclick="logout()" style="background:#ffffff15">Sair</button>
</div>
<div class="card" style="margin-top:20px">
<h3>🌐 MODO ONLINE COM AMIGOS</h3>

<div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
<button class="btn" onclick="createRoom()">CRIAR SALA + GERAR CÓDIGO</button>
