<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan Coins 💰</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#1a1a2e;color:#fff;min-height:100vh;padding:20px}
.container{max-width:460px;margin:0 auto}
h1{text-align:center;color:#ffd700;margin-bottom:30px;font-size:28px}
.tela{display:none}
.tela.ativa{display:block}
input{width:100%;padding:15px;font-size:16px;border:none;border-radius:12px;background:#2a2a4e;color:#fff;margin-bottom:12px;border:1px solid #444}
button{width:100%;padding:15px;font-size:16px;border:none;border-radius:12px;font-weight:bold;cursor:pointer;margin:8px 0}
button.primario{background:#ffd700;color:#000}
button.secundario{background:#374;color:#fff}
button.ranqueada{background:#9c27b0;color:#fff}
button.loja{background:#00bcd4;color:#fff}
.erro{color:#f66;text-align:center;margin:10px 0}
.moedas{text-align:center;font-size:22px;color:#ffd700;font-weight:bold;margin:10px 0}
.grade{display:grid;gap:5px;margin:20px 0}
.casa{aspect-ratio:1;background:#2a2a4e;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;font-size:18px}
.casa.selecionada{background:#ffd700;color:#000}
.casa.encontrada{background:#4caf50;color:#fff}
.palavras{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.palavra{padding:10px 14px;background:#2a2a4e;border-radius:10px}
.palavra.encontrada{opacity:0.5;text-decoration:line-through}
.placar{display:flex;justify-content:space-around;margin:15px 0}
.caixa{text-align:center;padding:10px;background:#2a2a4e;border-radius:10px}
.patente{text-align:center;padding:12px;border-radius:12px;margin:10px 0;font-weight:bold}
.oculta{display:none !important}
</style>
</head>
<body>
<div class="container">

<div id="telaLogin" class="tela ativa">
  <h1>🎸 Luan Coins 💰</h1>
  <input type="text" id="usuario" placeholder="Seu usuário">
  <input type="password" id="senha" placeholder="Sua senha">
  <div id="erroLogin" class="erro"></div>
  <button class="primario" id="btnEntrar">🎵 Entrar</button>
  <button class="secundario" id="btnCad">📝 Criar Conta</button>
</div>

<div id="telaCadastro" class="tela">
  <h1>📝 Nova Conta</h1>
  <input type="text" id="novoUsuario" placeholder="Nome">
  <input type="password" id="novaSenha" placeholder="Senha">
  <input type="password" id="confirmaSenha" placeholder="Repita a senha">
  <div id="erroCadastro" class="erro"></div>
  <button class="primario" id="btnCadastrar">✅ Cadastrar</button>
  <button class="secundario" id="btnVoltarLogin">← Voltar</button>
</div>

<div id="telaInicio" class="tela">
  <h1>Bem-vindo, <span id="nomeUsuario"></span>!</h1>
  <div class="moedas" id="saldoMoedas">💰 0 Luan Coins</div>
  <div class="patente" id="patenteUsuario"></div>
  <button class="primario" id="btnNormal">🎮 Modo Normal</button>
  <button class="ranqueada" id="btnRanqueada">🏆 Modo Ranqueada</button>
  <button class="loja" id="btnLoja">🛒 Loja</button>
  <button class="secundario" id="btnSair">🚪 Sair</button>
</div>

<div id="telaJogo" class="tela">
  <div class="moedas" id="saldoJogo"></div>
  <div class="placar">
    <div class="caixa"><div>Pontos</div><div id="pontos">0</div></div>
    <div class="caixa"><div>Nível</div><div id="nivel">1</div></div>
  </div>
  <div class="grade" id="grade"></div>
  <h3>Palavras:</h3>
  <div class="palavras" id="listaPalavras"></div>
  <br>
  <button id="btnProximo">Próximo Nível</button>
  <button class="secundario" id="btnVoltar">← Voltar</button>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>

<script>
const CRIADOR = 'Thiago Shelby';
const MOEDAS_POR_NIVEL = 20;
const PRECO_DICA = 15;

const PATENTES = [
  {nome: '🎵 Fã Iniciante', min:1, cor:'#9e9e9e'},
  {nome: '🎶 Seresteiro', min:5, cor:'#4caf50'},
  {nome: '🎤 Cantor', min:10, cor:'#2196f3'},
  {nome: '🎸 Estrela', min:20, cor:'#9c27b0'},
  {nome: '👑 Luan Master', min:35, cor:'#ffd700'},
  {nome: '🌟 Lenda Santana', min:50, cor:'#f44336'}
];

const firebaseConfig = {
  apiKey: "AIzaSyAkZYDcCsua7qzmdZDj__KIrYTAWIslvsI",
  authDomain: "luan-coins.firebaseapp.com",
  databaseURL: "https://luan-coins-default-rtdb.firebaseio.com",
  projectId: "luan-coins",
  storageBucket: "luan-coins.firebasestorage.app",
  messagingSenderId: "379641584803",
  appId: "1:379641584803:web:c1bfc0c0715e3347fef316"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const refContas = db.ref('contas');
const refRanking = db.ref('ranking');

const bancoPalavras = ['LUAN','SANTANA','SERESTA','FORRO','AMOR','CANCAO','VIOLAO','FESTA','BRASIL','ESTRELA','CANTOR','MUSICA','CORACAO','PAIXAO','SAUDADE','SONHO','ALEGRIA','BEIJO','FAMILIA','AMIGOS','NOITE','LUA','SOL','ESTRADA','CIDADE','ROCA','CAMPO','FLORES','CANTO','PALCO','FAS'];
const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

let usuarioAtual = null, dadosUsuario = null, modo = 'normal', nivel = 1, pontos = 0;
let grade = [], selecionadas = [], encontradas = [], palavrasRodada = [];

function mostrarTela(id){
  document.querySelectorAll('.tela').forEach(t=>t.classList.remove('ativa'));
  document.getElementById(id).classList.add('ativa');
  if(id==='telaInicio') atualizarInicio();
}

function atualizarInicio(){
  document.getElementById('nomeUsuario').textContent = usuarioAtual;
  document.getElementById('saldoMoedas').textContent = `💰 ${dadosUsuario.moedas||0} Luan Coins`;
  const nr = dadosUsuario.nivelRanqueada||1;
  const p = PATENTES.reduce((a,b)=>nr>=b.min?b:a,PATENTES[0]);
  document.getElementById('patenteUsuario').textContent = p.nome;
  document.getElementById('patenteUsuario').style.background = p.cor+'33';
  document.getElementById('patenteUsuario').style.color = p.cor;
}

async function entrar(){
  const u = document.getElementById('usuario').value.trim();
  const s = document.getElementById('senha').value;
  const erro = document.getElementById('erroLogin');
  if(!u||!s){erro.textContent='Preencha tudo!';return;}
  const snap = await refContas.child(u).once('value');
  if(!snap.exists()){erro.textContent='Usuário não existe!';return;}
  if(snap.val().senha !== s){erro.textContent='Senha errada!';return;}
  usuarioAtual = u; dadosUsuario = snap.val();
  erro.textContent=''; mostrarTela('telaInicio');
}

async function cadastrar(){
  const u = document.getElementById('novoUsuario').value.trim();
  const s = document.getElementById('novaSenha').value;
  const c = document.getElementById('confirmaSenha').value;
  const erro = document.getElementById('erroCadastro');
  if(u.length<3){erro.textContent='Nome muito curto!';return;}
  if(s.length<4){erro.textContent='Senha muito curta!';return;}
  if(s!==c){erro.textContent='Senhas diferentes!';return;}
  if((await refContas.child(u).once('value')).exists()){erro.textContent='Já existe!';return;}
  await refContas.child(u).set({senha:s,nivelMax:1,nivelRanqueada:1,pontosTotal:0,moedas:50});
  await refRanking.child(u).set({nome:u,pontos:0,nivel:1});
  alert('✅ Conta criada!'); mostrarTela('telaLogin'); document.getElementById('usuario').value=u;
}

function sair(){usuarioAtual=null;dadosUsuario=null;mostrarTela('telaLogin');}

function iniciarJogo(tipo){
  modo=tipo; nivel=dadosUsuario.nivelMax; pontos=0; encontradas=[];
  mostrarTela('telaJogo'); montarRodada();
}

function montarRodada(){
  const tam = Math.min(10+nivel, 14);
  selecionadas=[]; encontradas=[];
  palavrasRodada = [...bancoPalavras].sort(()=>Math.random()-0.5).slice(0,Math.min(5+nivel,10));
  grade = Array(tam).fill().map(()=>Array(tam).fill(''));
  
  palavrasRodada.forEach(palavra=>{
    let ok=false,t=0;
    while(!ok && t<500){
      const dir=Math.random()>0.5, comp=palavra.length;
      const ml = tam - (dir?0:comp), mc = tam - (dir?comp:0);
      if(ml<=0||mc<=0){t++;continue;}
      const l=Math.floor(Math.random()*ml), c=Math.floor(Math.random()*mc);
      let livre=true;
      for(let i=0;i<comp;i++){
        const nl=dir?l:l+i, nc=dir?c+i:c;
        if(grade[nl][nc] && grade[nl][nc]!==palavra[i]){livre=false;break;}
      }
      if(livre){
        for(let i=0;i<comp;i++){
          const nl=dir?l:l+i, nc=dir?c+i:c;
          grade[nl][nc]=palavra[i];
        }
        ok=true;
      }
      t++;
    }
  });
  for(let l=0;l<tam;l++)for(let c=0;c<tam;c++)if(!grade[l][c])grade[l][c]=letras[Math.floor(Math.random()*26)];
  document.getElementById('nivel').textContent=nivel;
  document.getElementById('saldoJogo').textContent = `💰 ${dadosUsuario.moedas||0}`;
  renderizar();
}

function renderizar(){
  const tam = grade.length;
  const g = document.getElementById('grade');
  g.style.gridTemplateColumns = `repeat(${tam},1fr)`;
  g.innerHTML='';
  for(let l=0;l<tam;l++){
    for(let c=0;c<tam;c++){
      const d = document.createElement('div');
      d.className='casa';
      d.textContent = grade[l][c];
      d.onclick = ()=>clicar(l,c);
      if(selecionadas.some(p=>p.l===l&&p.c===c))d.classList.add('selecionada');
      if(encontradas.some(e=>e.linhas.has(l)&&e.colunas.has(c)))d.classList.add('encontrada');
      g.appendChild(d);
    }
  }
  const lista = document.getElementById('listaPalavras');
  lista.innerHTML='';
  palavrasRodada.forEach(p=>{
    const d = document.createElement('div');
    d.className='palavra' + (encontradas.some(e=>e.texto===p)?' encontrada':'');
    d.textContent=p;
    lista.appendChild(d);
  });
}

function clicar(l,c){
  if(encontradas.some(e=>e.linhas.has(l)&&e.colunas.has(c)))return;
  const i = selecionadas.findIndex(p=>p.l===l&&p.c===c);
  if(i>=0){selecionadas.splice(i);renderizar();return;}
  selecionadas.push({l,c});
  if(selecionadas.length>=2){
    const lin = new Set(selecionadas.map(p=>p.l));
    const col = new Set(selecionadas.map(p=>p.c));
    let txt='';
    if(lin.size===1){
      selecionadas.sort((a,b)=>a.c-b.c);
      txt = selecionadas.map(p=>grade[p.l][p.c]).join('');
      verificar(txt) || verificar(txt.split('').reverse().join(''));
    } else if(col.size===1){
      selecionadas.sort((a,b)=>a.l-b.l);
      txt = selecionadas.map(p=>grade[p.l][p.c]).join('');
      verificar(txt) || verificar(txt.split('').reverse().join(''));
    }
  }
  renderizar();
}

async function verificar(palavra){
  if(palavrasRodada.includes(palavra) && !encontradas.some(e=>e.texto===palavra)){
    encontradas.push({texto:palavra, linhas:new Set(selecionadas.map(p=>p.l)), colunas:new Set(selecionadas.map(p=>p.c))});
    pontos += palavra.length * (modo==='ranqueada'?20:10);
    document.getElementById('pontos').textContent = pontos;
    selecionadas=[];
    if(encontradas.length === palavrasRodada.length){
      dadosUsuario.moedas = (dadosUsuario.moedas||0) + MOEDAS_POR_NIVEL;
      if(modo==='ranqueada')dadosUsuario.nivelRanqueada = (dadosUsuario.nivelRanqueada||1)+1;
      dadosUsuario.nivelMax = Math.max(dadosUsuario.nivelMax, nivel+1);
      await refContas.child(usuarioAtual).update(dadosUsuario);
      alert(`🎉 Nível ${nivel} concluído!\n+${MOEDAS_POR_NIVEL} 💰!`);
    }
    return true;
  }
  return false;
}

function proximoNivel(){
  if(encontradas.length < palavrasRodada.length && !confirm('Ainda tem palavras! Continuar?'))return;
  nivel++; pontos=0; montarRodada();
}

// LIGAR BOTÕES
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('btnEntrar').onclick = entrar;
  document.getElementById('btnCad').onclick = ()=>mostrarTela('telaCadastro');
  document.getElementById('btnVoltarLogin').onclick = ()=>mostrarTela('telaLogin');
  document.getElementById('btnCadastrar').onclick = cadastrar;
  document.getElementById('btnNormal').onclick = ()=>iniciarJogo('normal');
  document.getElementById('btnRanqueada').onclick = ()=>iniciarJogo('ranqueada');
  document.getElementById('btnLoja').onclick = ()=>alert('Em breve!');
  document.getElementById('btnSair').onclick = sair;
  document.getElementById('btnProximo').onclick = proximoNivel;
  document.getElementById('btnVoltar').onclick = ()=>mostrarTela('telaInicio');
});
</script>
</body>
</html>
