<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caça-Palavras Luan Santana 🏆 MODO EXTREMO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
:root{--dourado:#f2c94c;--vermelho:#d32f2f;--verde:#4caf50;--roxo:#9c27b0;--fundo:#1a1a2e;--fundo2:#0f0f1a}
body{background:linear-gradient(135deg,var(--fundo),var(--fundo2));min-height:100vh;color:#fff;padding:15px}
.container{max-width:720px;margin:0 auto}

.cabecalho{display:flex;justify-content:space-between;align-items:center;padding:15px;background:rgba(0,0,0,0.5);border-radius:12px;margin-bottom:15px;border:1px solid rgba(242,201,76,0.2)}
.perfil{display:flex;align-items:center;gap:10px}
.avatar{width:45px;height:45px;border-radius:50%;background:linear-gradient(135deg,var(--dourado),var(--vermelho));display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px}
.nome-usuario{font-weight:bold;font-size:16px}
.info-nivel{font-size:12px;opacity:0.7}
.moedas{display:flex;align-items:center;gap:5px;background:rgba(242,201,76,0.15);padding:8px 15px;border-radius:20px}
.valor-moeda{font-weight:bold;color:var(--dourado);font-size:18px}

.tela{background:rgba(0,0,0,0.4);border-radius:16px;padding:25px;margin-bottom:20px;border:1px solid rgba(255,255,255,0.05)}
.escondida{display:none}
h1{text-align:center;color:var(--dourado);margin-bottom:20px;font-size:24px}

input{width:100%;padding:15px;font-size:18px;border:none;border-radius:10px;background:rgba(255,255,255,0.1);color:#fff;margin-bottom:15px}
button{width:100%;padding:15px;font-size:18px;border:none;border-radius:10px;background:linear-gradient(90deg,var(--dourado),var(--vermelho));color:#000;font-weight:bold;cursor:pointer;transition:transform 0.2s ease;margin:5px 0}
button:active{transform:scale(0.97)}
.botao-secundario{background:linear-gradient(90deg,#444,#222);color:#fff}
.botao-competitivo{background:linear-gradient(90deg,var(--roxo),var(--vermelho));color:#fff}

.abas{display:flex;gap:8px;margin-bottom:20px}
.aba{flex:1;padding:10px;border-radius:8px;background:rgba(255,255,255,0.05);text-align:center;cursor:pointer;font-weight:bold;font-size:14px}
.aba.ativa{background:var(--dourado);color:#000}

.placar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.caixa-pontos{background:rgba(242,201,76,0.1);padding:12px;border-radius:10px;text-align:center}
.titulo-placar{font-size:12px;opacity:0.7;margin-bottom:3px}
.valor-placar{font-size:20px;font-weight:bold;color:var(--dourado)}
.caixa-nivel{background:rgba(156,39,176,0.1);border:1px solid rgba(156,39,176,0.3)}
.texto-nivel{color:var(--roxo)}

.grade{display:grid;gap:4px;margin:20px auto}
.casa{aspect-ratio:1;background:rgba(255,255,255,0.08);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;user-select:none}
.casa.selecionada{background:var(--dourado);color:#000}
.casa.encontrada{background:var(--verde);color:#fff}

.palavras{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.palavra{padding:8px 12px;background:rgba(255,255,255,0.08);border-radius:8px;font-weight:bold}
.palavra.encontrada{opacity:0.4;text-decoration:line-through;background:rgba(76,175,80,0.2)}

.lista-ranking{display:flex;flex-direction:column;gap:8px;margin-top:15px}
.item-ranking{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(255,255,255,0.05);border-radius:8px}
.posicao{width:30px;text-align:center;font-weight:bold}
.posicao-1{color:var(--dourado);font-size:20px}
.posicao-2{color:#c0c0c0}
.posicao-3{color:#cd7f32}
.nome-rank{flex:1;font-weight:bold}
.pontos-rank{color:var(--dourado);font-weight:bold}
.voce{border:1px solid var(--dourado)}

.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a2e;border:2px solid var(--dourado);border-radius:16px;padding:30px;max-width:90%;width:400px;z-index:100;text-align:center}
.fundo-modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:99}
</style>
</head>
<body>
<div class="container">

<div id="telaEntrada" class="tela">
  <h1>🎸 Caça-Palavras<br>Luan Santana</h1>
  <input type="text" id="nomeJogador" placeholder="Digite seu nome">
  <button onclick="iniciarJogo('normal')">🎮 Modo Normal</button>
  <button class="botao-competitivo" onclick="iniciarJogo('extremo')">🔥 Modo Competitivo EXTREMO</button>
  <button class="botao-secundario" onclick="carregarEstatisticas()">📊 Minhas Estatísticas</button>
</div>

<div id="telaJogo" class="escondida">
  <div class="cabecalho">
    <div class="perfil">
      <div class="avatar" id="avatar">T</div>
      <div>
        <div class="nome-usuario" id="mostraNome"></div>
        <div class="info-nivel">Nível <span id="nivel">1</span> • <span id="modoJogo">Normal</span></div>
      </div>
    </div>
    <div class="moedas">
      <span>💰</span>
      <span class="valor-moeda" id="mostraMoedas">0</span>
    </div>
  </div>

  <div class="abas">
    <div class="aba ativa" onclick="trocarAba('jogo')">🎮 Jogo</div>
    <div class="aba" onclick="trocarAba('ranking')">🏆 Ranking</div>
    <div class="aba" onclick="trocarAba('stats')">📊 Stats</div>
  </div>

  <div id="abaJogo">
    <div class="placar">
      <div class="caixa-pontos">
        <div class="titulo-placar">Pontos</div>
        <div class="valor-placar" id="pontos">0</div>
      </div>
      <div class="caixa-pontos caixa-nivel">
        <div class="titulo-placar texto-nivel">Nível</div>
        <div class="valor-placar texto-nivel" id="numeroNivel">1</div>
      </div>
      <div class="caixa-pontos">
        <div class="titulo-placar">Palavras</div>
        <div class="valor-placar"><span id="qtdEncontradas">0</span>/<span id="totalPalavras">0</span></div>
      </div>
    </div>
    <div class="grade" id="grade"></div>
    <h3>Palavras a encontrar:</h3>
    <div class="palavras" id="listaPalavras"></div>
    <br>
    <button onclick="proximoNivel()">➡️ Próximo Nível</button>
    <button class="botao-secundario" onclick="salvarESair()">💾 Salvar & Sair</button>
  </div>

  <div id="abaRanking" class="escondida">
    <h2 style="color:var(--dourado);margin-bottom:15px">🏆 Ranking Geral</h2>
    <div class="lista-ranking" id="listaRanking"></div>
    <button class="botao-secundario" onclick="trocarAba('jogo')">⬅️ Voltar ao Jogo</button>
  </div>

  <div id="abaStats" class="escondida">
    <h2 style="color:var(--dourado);margin-bottom:15px">📊 Suas Estatísticas</h2>
    <p style="margin:10px 0"><strong>Nível mais alto:</strong> <span id="statNivel">1</span></p>
    <p style="margin:10px 0"><strong>Pontuação total:</strong> <span id="statPontos">0</span></p>
    <p style="margin:10px 0"><strong>Moedas acumuladas:</strong> <span id="statMoedas">0</span> 💰</p>
    <p style="margin:10px 0"><strong>Palavras encontradas:</strong> <span id="statPalavras">0</span></p>
    <p style="margin:10px 0"><strong>Maior sequência:</strong> <span id="statSequencia">0</span> 🔥</p>
    <button class="botao-secundario" onclick="trocarAba('jogo')">⬅️ Voltar ao Jogo</button>
  </div>
</div>

<div id="fundoModal" class="fundo-modal escondida"></div>
<div id="modal" class="modal escondida">
  <h2 id="tituloModal">🎉 Nível Completo!</h2>
  <p id="textoModal" style="margin:15px 0"></p>
  <button onclick="fecharModal()">Continuar</button>
</div>

</div>

<script>
const bancoPalavras = [
  'LUAN','SANTANA','SERESTA','FORRO','AMOR','CANCAO','VIOLAO','FESTA',
  'BRASIL','ESTRELA','CANTOR','MUSICA','CORACAO','PAIXAO','SAUDADE',
  'SONHO','ALEGRIA','BEIJO','FAMILIA','AMIGOS','NOITE','LUA','SOL',
  'ESTRADA','CIDADE','ROCA','CAMPO','FLORES','CANTO','PALCO','FAS',
  'RECORDACAO','PROMESSA','DESTINO','CAMINHO','VIDA','ESPERANCA',
  'FELICIDADE','SANFONA','PIANO','GUITARRA','BATERIA','MELODIA','RITMO',
  'VERSOS','REFRAO','BANDA','HISTORIA','LEGENDA','TROFEU','OURO',
  'CEU','MAR','RIO','SERRA','PEDRA','DIAMANTE','BRILHO','FOGO',
  'CORAGEM','FIDELIDADE','HONRA','TESOURO','JOIA','PEROLA','ALMA'
];
const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

let jogador='', modo='normal', nivel=1, pontos=0, pontosTotais=0, moedas=0;
let sequenciaAtual=0, maiorSequencia=0, totalPalavrasEncontradas=0, nivelMaximo=1;
let grade=[], selecionadas=[], encontradas=[], palavrasRodada=[], ranking=[];

function configNivel(n){
  return {
    tamanho: Math.min(10+Math.floor(n/2), modo==='extremo'?18:14),
    qtdPalavras: Math.min(6+n, modo==='extremo'?25:15)
  };
}

function salvarProgresso(){
  localStorage.setItem('jogoLuan', JSON.stringify({
    nome:jogador, nivelMaximo, pontosTotais, moedas,
    totalPalavrasEncontradas, maiorSequencia, ranking
  }));
}

function carregarProgresso(){
  const d=localStorage.getItem('jogoLuan');
  if(d){
    const obj=JSON.parse(d);
    jogador=obj.nome||'';
    nivelMaximo=obj.nivelMaximo||1;
    pontosTotais=obj.pontosTotais||0;
    moedas=obj.moedas||0;
    totalPalavrasEncontradas=obj.totalPalavrasEncontradas||0;
    maiorSequencia=obj.maiorSequencia||0;
    ranking=obj.ranking||[];
  }
}

function iniciarJogo(tipoModo){
  const nome=document.getElementById('nomeJogador').value.trim();
  if(!nome){alert('Digite seu nome! 🎸');return}
  jogador=nome; modo=tipoModo;
  carregarProgresso();
  nivel = (nivelMaximo>1 && confirm(`Retomar do Nível ${nivelMaximo}?`)) ? nivelMaximo : 1;
  pontos=0; encontradas=[];
  
  document.getElementById('avatar').textContent=jogador[0].toUpperCase();
  document.getElementById('mostraNome').textContent=jogador;
  document.getElementById('modoJogo').textContent=modo==='extremo'?'EXTREMO 🔥':'Normal';
  document.getElementById('telaEntrada').classList.add('escondida');
  document.getElementById('telaJogo').classList.remove('escondida');
  iniciarRodada();
}

function iniciarRodada(){
  const cfg=configNivel(nivel);
  selecionadas=[]; encontradas=[]; sequenciaAtual=0;
  
  palavrasRodada = [...bancoPalavras].sort(()=>Math.random()-0.5).slice(0,cfg.qtdPalavras);
  grade = Array(cfg.tamanho).fill().map(()=>Array(cfg.tamanho).fill(''));
  
  palavrasRodada.forEach(palavra=>{
    let ok=false,t=0;
    while(!ok && t<150){
      const dir=Math.random()>0.5;
      const maxL=cfg.tamanho-(dir?0:palavra.length);
      const maxC=cfg.tamanho-(dir?palavra.length:0);
      if(maxL<=0||maxC<=0)break;
      const l=Math.floor(Math.random()*maxL);
      const c=Math.floor(Math.random()*maxC);
      let livre=true;
      for(let i=0;i<palavra.length;i++){
        const nl=dir?l:l+i, nc=dir?c+i:c;
        if(grade[nl][nc] && grade[nl][nc]!==palavra[i]){livre=false;break}
      }
      if(livre){
        for(let i=0;i<palavra.length;i++){
          const nl=dir?l:l+i, nc=dir?c+i:c;
          grade[nl][nc]=palavra[i];
        }
        ok=true;
      }
      t++;
    }
  });
  
  for(let l=0;l<cfg.tamanho;l++)
    for(let c=0;c<cfg.tamanho;c++)
      if(!grade[l][c])grade[l][c]=letras[Math.floor(Math.random()*26)];
  
  document.getElementById('numeroNivel').textContent=nivel;
  document.getElementById('nivel').textContent=nivel;
  document.getElementById('totalPalavras').textContent=palavrasRodada.length;
  atualizarPlacar(); renderizarGrade();
}

function renderizarGrade(){
  const cfg=configNivel(nivel);
  const gradeEl=document.getElementById('grade');
  gradeEl.style.gridTemplateColumns=`repeat(${cfg.tamanho},1fr)`;
  gradeEl.innerHTML='';
  
  for(let l=0;l<cfg.tamanho;l++){
    for(let c=0;c<cfg.tamanho;c++){
      const div=document.createElement('div');
      div.className='casa'; div.textContent=grade[l][c];
      div.onclick=()=>clicar(l,c);
      if(selecionadas.some(p=>p.l===l&&p.c===c))div.classList.add('selecionada');
      if(encontradas.some(e=>e.linhas.has(l)&&e.colunas.has(c)))div.classList.add('encontrada');
      gradeEl.appendChild(div);
    }
  }
  
  const listaEl=document.getElementById('listaPalavras'); listaEl.innerHTML='';
  palavrasRodada.forEach(p=>{
    const d=document.createElement('div');
    d.className='palavra'+(encontradas.some(e=>e.texto===p)?' encontrada':'');
    d.textContent=p; listaEl.appendChild(d);
  });
}

function atualizarPlacar(){
  document.getElementById('pontos').textContent=pontos;
  document.getElementById('qtdEncontradas').textContent=encontradas.length;
  document.getElementById('mostraMoedas').textContent=moedas;
}

function clicar(l,c){
  if(encontradas.some(e=>e.linhas.has(l)&&e.colunas.has(c)))return;
  const i=selecionadas.findIndex(p=>p.l===l&&p.c===c);
  if(i>=0){selecionadas.splice(i);renderizarGrade();return}
  selecionadas.push({l,c});
  
  if(selecionadas.length>=2){
    const lin=new Set(selecionadas.map(p=>p.l));
    const col=new Set(selecionadas.map(p=>p.c));
    let txt='';
    if(lin.size===1){
      selecionadas.sort((a,b)=>a.c-b.c);
      txt=selecionadas.map(p=>grade[p.l][p.c]).join('');
    }else if(col.size===1){
      selecionadas.sort((a,b)=>a.l-b.l);
      txt=selecionadas.map(p=>grade[p.l][p.c]).join('');
    }
    verificar(txt) || verificar(txt.split('').reverse().join(''));
  }
  renderizarGrade();
}

function verificar(palavra){
  if(palavrasRodada.includes(palavra) && !encontradas.some(e=>e.texto===palavra)){
    encontradas.push({
      texto:palavra,
      linhas:new Set(selecionadas.map(p=>p.l)),
      colunas:new Set(selecionadas.map(p=>p.c))
    });
    const pts=palavra.length*(modo==='extremo'?20:10);
    pontos+=pts; pontosTotais+=pts;
    moedas+=Math.floor(pts/(modo==='extremo'?4:5));
    totalPalavrasEncontradas++;
    sequenciaAtual++;
    if(sequenciaAtual>maiorSequencia)maiorSequencia=sequenciaAtual;
    selecionadas=[]; salvarProgresso(); atualizarPlacar();
    
    if(encontradas.length===palavrasRodada.length){
      nivelMaximo=Math.max(nivelMaximo,nivel+1);
      salvarProgresso(); salvarNoRanking();
      setTimeout(()=>abrirModal(`🎉 Nível ${nivel} Completo!`,`Pontos: ${pontos}\nMoedas: +${Math.floor(pontos/(modo==='extremo'?4:5))} 💰`),300);
    }
    return true;
  }
  return false;
}

function proximoNivel(){
  if(encontradas.length<palavrasRodada.length && !confirm('Ainda há palavras! Tem certeza?'))return;
  nivel++; pontos=0; iniciarRodada();
}

function salvarNoRanking(){
  ranking=ranking.filter(r=>r.nome!==jogador);
  ranking.push({nome:jogador,pontos:pontosTotais,nivel:nivel,data:new Date().toLocaleDateString('pt-BR')});
  ranking.sort((a,b)=>b.pontos-a.pontos);
  ranking=ranking.slice(0,15); salvarProgresso();
}

function carregarRanking(){
  const el=document.getElementById('listaRanking'); el.innerHTML='';
  if(!ranking.length){el.innerHTML='<p style="text-align:center;opacity:0.7">Jogue para aparecer! 🏆</p>';return}
  ranking.forEach((item,idx)=>{
    const d=document.createElement('div');
    d.className=`item-ranking ${item.nome===jogador?'voce':''}`;
    let posCls='';
    if(idx===0)posCls='posicao-1';
    else if(idx===1)posCls='posicao-2';
    else if(idx===2)posCls='posicao-3';
    d.innerHTML=`
      <div class="posicao ${posCls}">${idx+1}º</div>
      <div class="nome-rank">${item.nome}</div>
      <div class="pontos-rank">${item.pontos} pts • N${item.nivel}</div>
    `;
    el.appendChild(d);
  });
}

function carregarEstatisticas(){
  carregarProgresso();
  document.getElementById('statNivel').textContent=nivelMaximo;
  document.getElementById('statPontos').textContent=pontosTotais;
  document.getElementById('statMoedas').textContent=moedas;
  document.getElementById('statPalavras').textContent=totalPalavrasEncontradas;
  document.getElementById('statSequencia').textContent=maiorSequencia;
  document.getElementById('telaEntrada').classList.add('escondida');
  document.getElementById('telaJogo').classList.remove('escondida');
  trocarAba('stats');
}

function trocarAba(nome){
  document.querySelectorAll('.aba').forEach(a=>a.classList.remove('ativa'));
  event.target.classList.add('ativa');
  document.getElementById('abaJogo').classList.toggle('escondida',nome!=='jogo');
  document.getElementById('abaRanking').classList.toggle('escondida',nome!=='ranking');
  document.getElementById('abaStats').classList.toggle('escondida',nome!=='stats');
  if(nome==='ranking')carregarRanking();
}

function abrirModal(titulo,texto){
  document.getElementById('tituloModal').textContent=titulo;
  document.getElementById('textoModal').textContent=texto;
  document.getElementById('fundoModal').classList.remove('escondida');
  document.getElementById('modal').classList.remove('escondida');
}
function fecharModal(){
  document.getElementById('fundoModal').classList.add('escondida');
  document.getElementById('modal').classList.add('escondida');
}

function salvarESair(){
  salvarProgresso(); alert('✅ Salvo!');
  document.getElementById('telaEntrada').classList.remove('escondida');
  document.getElementById('telaJogo').classList.add('escondida');
  document.getElementById('nomeJogador').value=jogador;
}
</script>
</body>
</html>
