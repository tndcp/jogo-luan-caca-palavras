<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Luan Games</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}
body{background:#0e0e1a;overflow:hidden;font-family:Montserrat;color:#fff}
#ui{position:fixed;top:0;left:0;width:100%;padding:6px;display:flex;justify-content:space-between;z-index:10;pointer-events:none}
#ui span{font-family:Bebas Neue;font-size:14px;background:#000c;padding:4px 8px;border-radius:8px}
#inv{position:fixed;top:38px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:10}
.slot{width:64px;background:#000c;border:2px solid #ffffff22;border-radius:8px;padding:3px;text-align:center;font-size:8px}
.slot.active{border-color:#ffcc00;background:#ffcc0033}
#scope{position:fixed;inset:0;background:radial-gradient(transparent 18%,#000 19%,#000 100%);display:none;z-index:15;pointer-events:none}
#scope::after{content:'';position:absolute;left:50%;top:0;width:2px;height:100%;background:#00ff88;opacity:.6}
#scope::before{content:'';position:absolute;top:50%;left:0;width:100%;height:2px;background:#00ff88;opacity:.6}
#admPanel{position:fixed;top:78px;right:8px;background:#000;border:1.5px solid #00ff88;color:#00ff88;font-family:monospace;font-size:9px;padding:7px;border-radius:10px;z-index:20;display:none;width:150px}
.switch{width:28px;height:14px;background:#333;border-radius:10px;position:relative;display:inline-block}.switch.on{background:#00ff88}.switch:after{content:'';width:10px;height:10px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:.2s}.switch.on:after{left:16px}
canvas{display:block}
#joy{position:fixed;bottom:12px;left:12px;width:96px;height:96px;background:#ffffff14;border-radius:50%;z-index:10}
#stick{position:absolute;width:42px;height:42px;background:linear-gradient(180deg,#ff2e7a,#ffcc00);border-radius:50%;left:27px;top:27px}
.btns{position:fixed;right:10px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:10}
.circle{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9px;text-align:center}
#menu{position:fixed;inset:0;background:linear-gradient(180deg,#0f0f1a,#1e1e3a);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;text-align:center;padding:15px;overflow-y:auto}
.btn{background:linear-gradient(90deg,#ff2e7a,#ffcc00);border:0;padding:11px 32px;border-radius:30px;color:#000;font-weight:800;font-size:16px;margin-top:8px}
.card{background:#ffffff10;padding:10px;border-radius:14px;margin-top:8px;width:280px}
</style>
</head>
<body>
<div id="ui"><span>❤️ <b id="life">100</b> 🦺 <b id="vest">0</b></span><span>👥 <b id="alive">16</b></span><span>💰 <b id="coins">0</b> | <b id="rank">BRONZE</b></span></div>
<div id="inv"><div id="slot0" class="slot active"><div id="s0g">Pistola</div><div id="s0a">12</div></div><div id="slot1" class="slot"><div id="s1g">-</div><div id="s1a">0</div></div></div>
<div id="scope"><div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:180px;height:180px;border:2px solid #00ff88;border-radius:50%"></div></div>
<div id="admPanel"><b>ADM Thiago Shelby</b><br>Vida <div class="switch" onclick="adm.life=!adm.life;this.classList.toggle('on',adm.life)"></div> Muni <div class="switch" onclick="adm.ammo=!adm.ammo;this.classList.toggle('on',adm.ammo)"></div> Dano <div class="switch" onclick="adm.dmg=!adm.dmg;this.classList.toggle('on',adm.dmg)"></div><br><button style="margin-top:5px;background:#00ff88;border:0;padding:3px 6px;border-radius:6px;font-size:9px" onclick="spawnLoot()">LOOT</button><button style="background:#ffcc00;border:0;padding:3px 6px;border-radius:6px;font-size:9px" onclick="addCoins(5000)">+5k</button></div>

<div id="joy"><div id="stick"></div></div>
<div class="btns">
<div style="display:flex;gap:8px"><div id="zoomBtn" class="circle" style="background:#00e5ff;color:#000;display:none">ZOOM</div><div id="grenade" class="circle" style="background:#9c27b0;color:#fff">💣</div><div id="action" class="circle" style="background:#00ff88;color:#000">MOTO</div></div>
<div style="display:flex;gap:8px"><div id="swap" class="circle" style="background:#ffffff22;color:#fff;border:1px solid #fff4">TROCA</div><div id="shoot" class="circle" style="background:linear-gradient(180deg,#ffcc00,#ff8800);color:#000;width:72px;height:72px;font-size:12px">TIRO</div></div>
</div>

<canvas id="game"></canvas>

<div id="menu">
<h1 style="font-family:Bebas Neue;font-size:52px;background:linear-gradient(90deg,#ff2e7a,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent">LUAN GAMES</h1>
<h2 style="font-family:Bebas Neue;font-size:28px">FREE FIRE V10.5 RANKED</h2>
<div class="card">
<div style="display:flex;justify-content:space-between;font-size:11px"><span>💰 Moedas: <b id="mCoins">0</b></span><span>🏆 Rank: <b id="mRank">BRONZE</b></span></div>
<div style="display:flex;justify-content:space-between;font-size:10px;margin-top:4px;opacity:.7"><span>Booyah: <b id="mWins">0</b></span><span>Kills: <b id="mKills">0</b></span></div>
</div>
<input id="nick" placeholder="Nick (Thiago Shelby = ADM)" style="margin-top:10px;padding:8px;border-radius:10px;border:0;width:220px;text-align:center">
<button class="btn" onclick="startGame()">JOGAR RANKED</button>
<div class="card" style="font-size:10px">💰 +100 por kill | +1000 por Booyah<br>🏆 Bronze 0 | Prata 1000 | Ouro 3000 | Mestre 7000 | Desafiante 12000</div>
<p id="final" style="margin-top:8px;color:#ffcc00;font-weight:800"></p>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H; function resize(){W=innerWidth;H=innerHeight;canvas.width=W;canvas.height=H} resize(); onresize=resize;
const MAP=2600;
let cam={x:0,y:0}, player, bullets, enemies, squad, loots, houses, trees, motos, grenades, safeZone, playing=false;
let keys={x:0,y:0}, shooting=false, lastShot=0, onMoto=null, zoom=false, adm={life:false,ammo:false,dmg:false}, isMaster=false;
const GUNS={Pistola:{dmg:22,fire:280,ammo:12,range:420},Shotgun:{dmg:16,fire:650,ammo:6,range:270,pellets:5},AK:{dmg:34,fire:130,ammo:30,range:580},Sniper:{dmg:95,fire:1100,ammo:5,range:900}};
let save=JSON.parse(localStorage.getItem('luan_v105')||'{"coins":0,"kills":0,"wins":0,"rank":"BRONZE"}');
function saveGame(){ localStorage.setItem('luan_v105',JSON.stringify(save)); updateMenu(); }
function updateMenu(){ document.getElementById('mCoins').textContent=save.coins; document.getElementById('mRank').textContent=save.rank; document.getElementById('mWins').textContent=save.wins; document.getElementById('mKills').textContent=save.kills; document.getElementById('coins').textContent=save.coins; document.getElementById('rank').textContent=save.rank; let pts=save.coins; if(pts>=12000) save.rank='DESAFIANTE'; else if(pts>=7000) save.rank='MESTRE'; else if(pts>=3000) save.rank='OURO'; else if(pts>=1000) save.rank='PRATA'; else save.rank='BRONZE'; } updateMenu();
function addCoins(v){ save.coins+=v; saveGame(); }

function newGame(){
  player={x:MAP/2,y:MAP/2,r:15,life:100,vest:0,inv:[{gun:'Pistola',ammo:12},{gun:null,ammo:0}],activeSlot:0,angle:0,speed:4.8,grenades:2};
  bullets=[]; enemies=[]; squad=[]; loots=[]; houses=[]; trees=[]; motos=[]; grenades=[]; safeZone={x:MAP/2,y:MAP/2,r:1100,targetR:1100}; onMoto=null;
  for(let i=0;i<16;i++) houses.push({x:Math.random()*(MAP-200)+100,y:Math.random()*(MAP-200)+100,w:90+Math.random()*30,h:70+Math.random()*20});
  for(let i=0;i<45;i++) trees.push({x:Math.random()*MAP,y:Math.random()*MAP,r:20+Math.random()*8});
  for(let i=0;i<5;i++) motos.push({x:Math.random()*MAP,y:Math.random()*MAP,r:20,used:false});
  for(let i=0;i<35;i++){ let types=['ammo','Pistola','Shotgun','AK','Sniper','kit','vest','grenade']; loots.push({x:Math.random()*MAP,y:Math.random()*MAP,type:types[Math.floor(Math.random()*types.length)],taken:false}); }
  for(let i=0;i<12;i++) enemies.push({x:Math.random()*MAP,y:Math.random()*MAP,r:14,life:100,vest:Math.random()<0.5?50:0,gun:Object.keys(GUNS)[Math.floor(Math.random()*3)],ammo:99,lastShot:0});
  for(let i=0;i<3;i++) squad.push({x:player.x+Math.random()*60-30,y:player.y+Math.random()*60-30,r:12,life:100,gun:'AK',lastShot:0,offset:Math.random()*6});
  updateInv();
}
function updateInv(){ for(let i=0;i<2;i++){ let s=player.inv[i]; document.getElementById(`s${i}g`).textContent=s.gun||'-'; document.getElementById(`s${i}a`).textContent=s.gun?s.ammo:'0'; document.getElementById(`slot${i}`).classList.toggle('active',i==player.activeSlot); } document.getElementById('gnade')?.remove(); document.getElementById('squad'); let cur=player.inv[player.activeSlot]; document.getElementById('zoomBtn').style.display=cur.gun=='Sniper'?'flex':'none'; document.getElementById('coins').textContent=save.coins; }
function getCurGun(){ return player.inv[player.activeSlot]; }
function startGame(){ let nick=document.getElementById('nick').value.trim().toLowerCase(); isMaster=nick=='thiago shelby'; document.getElementById('admPanel').style.display=isMaster?'block':'none'; document.getElementById('menu').style.display='none'; newGame(); playing=true; loop(); setInterval(()=>{if(!playing)return; safeZone.targetR=Math.max(150,safeZone.r-200);},10000); }
function spawnLoot(){ loots.push({x:player.x+(Math.random()-0.5)*200,y:player.y+(Math.random()-0.5)*200,type:['AK','Sniper','vest','kit','grenade'][Math.floor(Math.random()*5)],taken:false}); }
function isColliding(x,y,r){ for(let h of houses){ if(x+r>h.x && x-r<h.x+h.w && y+r>h.y && y-r<h.y+h.h) return true; } for(let t of trees){ if(Math.hypot(x-t.x,y-t.y)<r+t.r) return true; } return false; }

function loop(){
  if(!playing) return; requestAnimationFrame(loop);
  safeZone.r+=(safeZone.targetR-safeZone.r)*0.02;
  let spd=onMoto?10:player.speed; let nx=player.x+keys.x*spd, ny=player.y+keys.y*spd;
  if(!isColliding(nx,player.y,player.r)) player.x=nx; if(!isColliding(player.x,ny,player.r)) player.y=ny;
  player.x=Math.max(0,Math.min(MAP,player.x)); player.y=Math.max(0,Math.min(MAP,player.y));
  if(keys.x||keys.y) player.angle=Math.atan2(keys.y,keys.x);
  if(onMoto){ onMoto.x=player.x; onMoto.y=player.y; }
  cam.x=player.x-W/2; cam.y=player.y-H/2;
  let cur=getCurGun();
  if(shooting && cur.gun && Date.now()-lastShot>GUNS[cur.gun].fire && (cur.ammo>0||adm.ammo)){ shoot(player,player.angle,cur.gun,adm.dmg?10:1); if(!adm.ammo) cur.ammo--; lastShot=Date.now(); updateInv(); }
  squad.forEach(s=>{ let tx=player.x+Math.cos(s.offset)*80, ty=player.y+Math.sin(s.offset)*80; let a=Math.atan2(ty-s.y,tx-s.x); if(Math.hypot(tx-s.x,ty-s.y)>20){ let ex=s.x+Math.cos(a)*3.5, ey=s.y+Math.sin(a)*3.5; if(!isColliding(ex,ey,s.r)){s.x=ex; s.y=ey;} } let en=enemies.sort((a,b)=>Math.hypot(a.x-s.x,a.y-s.y)-Math.hypot(b.x-s.x,b.y-s.y))[0]; if(en && Math.hypot(en.x-s.x,en.y-s.y)<500 && Date.now()-s.lastShot>400){ shoot(s,Math.atan2(en.y-s.y,en.x-s.x),s.gun,1); s.lastShot=Date.now(); } });
  enemies.forEach(e=>{ if(Math.hypot(e.x-safeZone.x,e.y-safeZone.y)>safeZone.r){ let a=Math.atan2(safeZone.y-e.y,safeZone.x-e.x); e.x+=Math.cos(a)*3; e.y+=Math.sin(a)*3; return; } let all=[player,...squad]; let t=all.sort((a,b)=>Math.hypot(a.x-e.x,a.y-e.y)-Math.hypot(b.x-e.x,b.y-e.y))[0]; let d=Math.hypot(t.x-e.x,t.y-e.y); if(d>300){ let a=Math.atan2(t.y-e.y,t.x-e.x); let ex=e.x+Math.cos(a)*2.2, ey=e.y+Math.sin(a)*2.2; if(!isColliding(ex,ey,e.r)){e.x=ex; e.y=ey;} } if(d<450 && Date.now()-e.lastShot>GUNS[e.gun].fire){ shoot(e,Math.atan2(t.y-e.y,t.x-e.x),e.gun,1); e.lastShot=Date.now(); } });
  bullets.forEach((b,i)=>{ b.x+=b.vx; b.y+=b.vy; b.life--; if(b.life<=0||isColliding(b.x,b.y,2)){bullets.splice(i,1); return} let targets=b.owner==player || squad.includes(b.owner)? enemies : [player,...squad,...enemies].filter(t=>t!=b.owner); targets.forEach(t=>{ if(Math.hypot(t.x-b.x,t.y-b.y)<t.r+5){ let dmg=b.dmg*(t.vest>0?0.55:1); if(t.vest>0) t.vest=Math.max(0,t.vest-dmg*0.6); t.life-=dmg; bullets.splice(i,1); if(t.life<=0){ if(enemies.includes(t)){ enemies.splice(enemies.indexOf(t),1); if(b.owner==player){ save.kills++; addCoins(100);} } if(squad.includes(t)) squad.splice(squad.indexOf(t),1); if(t==player &&!adm.life){ gameOver(false); } } if(t==player &&!adm.life){ document.getElementById('life').textContent=Math.floor(t.life); document.getElementById('vest').textContent=Math.floor(t.vest); } } }); });
  grenades.forEach((g,i)=>{ g.x+=g.vx; g.y+=g.vy; g.vx*=0.98; g.vy*=0.98; g.timer--; if(g.timer<=0){ [player,...squad,...enemies].forEach(t=>{ let d=Math.hypot(t.x-g.x,t.y-g.y); if(d<130 && (t!=player||!adm.life)){ t.life-=95*(1-d/130); if(t!=player&&t.life<=0){ let idx=enemies.indexOf(t); if(idx!=-1){enemies.splice(idx,1); if(g.owner==player){save.kills++; addCoins(100);}} } } }); grenades.splice(i,1); } });
  loots.forEach(l=>{ if(!l.taken && Math.hypot(player.x-l.x,player.y-l.y)<26){ l.taken=true; if(l.type in GUNS){ let empty=player.inv.findIndex(s=>!s.gun); if(empty!=-1) player.inv[empty]={gun:l.type,ammo:GUNS[l.type].ammo}; else player.inv[player.activeSlot]={gun:l.type,ammo:GUNS[l.type].ammo}; } else if(l.type=='ammo'){ let cur=getCurGun(); if(cur.gun) cur.ammo=GUNS[cur.gun].ammo; } else if(l.type=='kit') player.life=Math.min(100,player.life+45); else if(l.type=='vest') player.vest=100; else if(l.type=='grenade') player.grenades++; updateInv(); document.getElementById('life').textContent=Math.floor(player.life); document.getElementById('vest').textContent=Math.floor(player.vest); } });
  if(!adm.life && Math.hypot(player.x-safeZone.x,player.y-safeZone.y)>safeZone.r){ player.life-=0.4; document.getElementById('life').textContent=Math.floor(player.life); if(player.life<=0) gameOver(false); }
  ctx.fillStyle='#2e7d32'; ctx.fillRect(-cam.x,-cam.y,MAP,MAP);
  ctx.beginPath(); ctx.arc(safeZone.x-cam.x,safeZone.y-cam.y,safeZone.r,0,Math.PI*2); ctx.strokeStyle='#00e5ff'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='#ff174422'; ctx.fillRect(0,0,W,H); ctx.save(); ctx.beginPath(); ctx.arc(safeZone.x-cam.x,safeZone.y-cam.y,safeZone.r,0,Math.PI*2); ctx.clip(); ctx.clearRect(0,0,W,H); ctx.restore();
  houses.forEach(h=>{ ctx.fillStyle='#3e2723'; ctx.fillRect(h.x-cam.x,h.y-cam.y,h.w,h.h); ctx.fillStyle='#5d4037'; ctx.fillRect(h.x+8-cam.x,h.y+8-cam.y,h.w-16,h.h-16); });
  trees.forEach(t=>{ ctx.fillStyle='#1b5e20'; ctx.beginPath(); ctx.arc(t.x-cam.x,t.y-cam.y,t.r,0,Math.PI*2); ctx.fill(); });
  motos.forEach(m=>{ if(m.used && m!=onMoto) return; ctx.fillStyle=onMoto==m?'#ffcc00':'#00e5ff'; ctx.fillRect(m.x-14-cam.x,m.y-8-cam.y,28,16); });
  loots.filter(l=>!l.taken).forEach(l=>{ ctx.fillStyle=l.type=='kit'?'#00ff88':l.type=='vest'?'#9c27b0':l.type=='grenade'?'#ff6f00':'#fff'; ctx.fillRect(l.x-7-cam.x,l.y-7-cam.y,14,14); });
  enemies.forEach(e=>{ ctx.fillStyle='#ff1744'; ctx.beginPath(); ctx.arc(e.x-cam.x,e.y-cam.y,e.r,0,Math.PI*2); ctx.fill(); });
  squad.forEach(s=>{ ctx.fillStyle='#00e5ff'; ctx.beginPath(); ctx.arc(s.x-cam.x,s.y-cam.y,s.r,0,Math.PI*2); ctx.fill(); });
  bullets.forEach(b=>{ ctx.fillStyle=b.owner==player||squad.includes(b.owner)?'#ffeb3b':'#ff1744'; ctx.beginPath(); ctx.arc(b.x-cam.x,b.y-cam.y,3,0,Math.PI*2); ctx.fill(); });
  grenades.forEach(g=>{ ctx.fillStyle='#ff6f00'; ctx.beginPath(); ctx.arc(g.x-cam.x,g.y-cam.y,6,0,Math.PI*2); ctx.fill(); });
  ctx.fillStyle=onMoto?'#ffcc00':'#00ff88'; ctx.beginPath(); ctx.arc(player.x-cam.x,player.y-cam.y,player.r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.moveTo(player.x-cam.x,player.y-cam.y); ctx.lineTo(player.x-cam.x+Math.cos(player.angle)*(zoom?60:30),player.y-cam.y+Math.sin(player.angle)*(zoom?60:30)); ctx.stroke();
  document.getElementById('alive').textContent=enemies.length+squad.length+1;
  if(enemies.length==0) gameOver(true);
}
function shoot(owner,angle,gunName,dmgMult){ let g=GUNS[gunName]; let cnt=g.pellets||1; for(let i=0;i<cnt;i++){ let sp=(Math.random()-0.5)*(gunName=='Sniper'&&zoom?0.02:0.25); bullets.push({x:owner.x+Math.cos(angle)*22,y:owner.y+Math.sin(angle)*22,vx:Math.cos(angle+sp)*(zoom&&gunName=='Sniper'?20:14),vy:Math.sin(angle+sp)*(zoom&&gunName=='Sniper'?20:14),dmg:g.dmg*dmgMult,owner:owner,life:g.range/14}); } }
function gameOver(win){
  playing=false; if(win){ save.wins++; addCoins(1000); } saveGame();
  document.getElementById('menu').style.display='flex'; document.getElementById('final').innerHTML=win?`BOOYAH! +1000 moedas!`:`MORREU! +${save.kills*100} moedas no total`; updateMenu(); document.getElementById('scope').style.display='none'; zoom=false;
}
let joy=document.getElementById('joy'), stick=document.getElementById('stick');
joy.addEventListener('touchmove', e=>{ let r=joy.getBoundingClientRect(); let t=e.touches[0]; let dx=t.clientX-(r.left+48), dy=t.clientY-(r.top+48); let d=Math.hypot(dx,dy); if(d>38){dx=dx/d*38; dy=dy/d*38} stick.style.left=27+dx+'px'; stick.style.top=27+dy+'px'; keys.x=dx/38; keys.y=dy/38; },{passive:false});
joy.addEventListener('touchend', ()=>{stick.style.left='27px'; stick.style.top='27px'; keys.x=0; keys.y=0});
document.getElementById('shoot').addEventListener('touchstart', e=>{e.preventDefault(); shooting=true});
document.getElementById('shoot').addEventListener('touchend', ()=>shooting=false);
document.getElementById('swap').addEventListener('touchstart', ()=>{ player.activeSlot=player.activeSlot==0?1:0; updateInv(); });
document.getElementById('action').addEventListener('touchstart', ()=>{ if(onMoto){ onMoto=null; document.getElementById('action').innerHTML='MOTO'; return; } let near=motos.find(m=>!m.used && Math.hypot(player.x-m.x,player.y-m.y)<40); if(near){ onMoto=near; near.used=true; document.getElementById('action').innerHTML='SAIR'; } else { if(player.life<100 &&!adm.life){player.life=Math.min(100,player.life+30); document.getElementById('life').textContent=Math.floor(player.life);} } });
document.getElementById('grenade').addEventListener('touchstart', ()=>{ if(player.grenades<=0) return; player.grenades--; grenades.push({x:player.x+Math.cos(player.angle)*25,y:player.y+Math.sin(player.angle)*25,vx:Math.cos(player.angle)*7,vy:Math.sin(player.angle)*7,timer:90,owner:player}); updateInv(); });
document.getElementById('zoomBtn').addEventListener('touchstart', ()=>{ zoom=!zoom; document.getElementById('scope').style.display=zoom?'block':'none'; });
canvas.addEventListener('touchstart', e=>{ let t=e.touches[0]; player.angle=Math.atan2((t.clientY+cam.y)-player.y,(t.clientX+cam.x)-player.x); });
</script>
</body>
</html>
