<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan Santana — Caça-Palavras & Adedonha</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@1/dist/umd/lucide.min.js"></script>
<!-- PeerJS para Conexão P2P Multi-servidor -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root{--bg:#fdf9fb;--card:#fff;--text:#0f172a;--muted:#64748b;--accent:#bd3193;--accent-soft:rgba(189,49,147,.14);--accent2:#0891b2;--accent2-soft:rgba(8,145,178,.14);--border:rgba(15,23,42,.08);--ok:#16a34a;--warn:#d97706;--err:#dc2626;--shadow:0 10px 30px rgba(15,23,42,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--text);background-image:radial-gradient(circle at 15% 10%,rgba(189,49,147,.08),transparent 40%),radial-gradient(circle at 85% 90%,rgba(8,145,178,.08),transparent 40%);min-height:100vh}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:inherit;outline:none}
.screen{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 32px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand .logo{width:44px;height:44px;border-radius:12px;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff}
.brand h1{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:1rem;background:var(--bg);transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;font-weight:700;font-size:.95rem;transition:transform .1s,box-shadow .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(189,49,147,.3)}
.btn-primary:hover{background:#a82a82}
.btn-secondary{background:var(--card);border:1.5px solid var(--border);color:var(--text)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--accent)}
.btn-block{width:100%}
.btn-sm{padding:8px 14px;font-size:.85rem;border-radius:8px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 18px;margin-bottom:24px;box-shadow:0 2px 8px rgba(15,23,42,.04)}
.topbar .user{display:flex;align-items:center;gap:10px;font-weight:700}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem}
.menu-title{font-size:2rem;font-weight:800;letter-spacing:-.03em;margin-bottom:4px}
.menu-sub{color:var(--muted);margin-bottom:28px}
.game-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-bottom:28px}
.game-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.game-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent)}
.game-card .icon-big{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:#fff}
.game-card h3{font-size:1.25rem;font-weight:800;margin-bottom:6px}
.game-card p{color:var(--muted);font-size:.9rem;line-height:1.5}
.lobby-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;max-width:520px;margin:0 auto;box-shadow:var(--shadow)}
.lobby-box h2{font-size:1.4rem;font-weight:800;margin-bottom:6px}
.lobby-box p{color:var(--muted);margin-bottom:20px;font-size:.92rem}
.room-code{font-size:2rem;font-weight:800;letter-spacing:.3em;text-align:center;background:var(--accent-soft);color:var(--accent);border:2px dashed var(--accent);border-radius:12px;padding:18px;margin:14px 0;user-select:all}
.lobby-status{text-align:center;padding:14px;border-radius:10px;font-weight:600;margin:12px 0}
.lobby-status.wait{background:var(--accent2-soft);color:var(--accent2)}
.lobby-status.ok{background:rgba(22,163,74,.1);color:var(--ok)}
.opponent{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-radius:10px;margin:10px 0;font-weight:600}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;font-size:.9rem;margin-bottom:16px;cursor:pointer;background:none}
.back-btn:hover{color:var(--accent)}
</style>
</head>
<body>

<div id="loginScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><div class="logo"><i data-lucide="music-4" style="width:22px;height:22px"></i></div><h1>Luan Santana</h1></div>
    <p class="sub">Caça-palavras & Adedonha multiplayer.</p>
    <div class="field"><label>Seu Nome</label><input id="loginUser" type="text" placeholder="Digite seu nome"></div>
    <button class="btn btn-primary btn-block" id="btnLogin"><i data-lucide="play" style="width:18px;height:18px"></i> Entrar no Jogo</button>
  </div>
</div>

<div id="menuScreen" class="screen hidden">
  <div class="topbar">
    <div class="user"><div class="avatar" id="userAvatar">U</div><span id="userName">Usuário</span></div>
    <button class="btn btn-ghost btn-sm" id="btnLogout"><i data-lucide="log-out" style="width:16px;height:16px"></i> Sair</button>
  </div>
  <h2 class="menu-title">Escolha o jogo:</h2>
  <div class="game-cards">
    <div class="game-card" id="cardCaca"><div class="icon-big" style="background:linear-gradient(135deg,var(--accent),#e0457f)"><i data-lucide="search" style="width:26px;height:26px"></i></div><h3>Caça-Palavras</h3><p>Jogue solo ou multiplayer com amigo.</p></div>
  </div>
</div>

<div id="lobbyScreen" class="screen hidden">
  <button class="back-btn" id="lobbyBack"><i data-lucide="arrow-left" style="width:16px;height:16px"></i> Voltar</button>
  <div class="lobby-box">
    <h2>Sala Multiplayer</h2>
    <p>Crie uma sala ou digite o código do seu amigo abaixo:</p>
    <div id="lobbyCreate">
      <button class="btn btn-primary btn-block" id="btnCreateRoom"><i data-lucide="plus-circle" style="width:18px;height:18px"></i> Criar Sala</button>
      <div style="text-align:center;margin:14px 0;color:var(--muted);font-weight:700">— ou entrar em uma —</div>
      <div class="field"><label>Código da sala</label><input id="joinCode" type="text" maxlength="6" placeholder="Ex: AB3X9K" style="text-transform:uppercase;letter-spacing:.2em;text-align:center"></div>
      <button class="btn btn-secondary btn-block" id="btnJoinRoom"><i data-lucide="log-in" style="width:18px;height:18px"></i> Entrar na Sala</button>
    </div>
    <div id="lobbyRoom" class="hidden">
      <div class="lobby-status wait" id="lobbyStatus">Conectando ao servidor...</div>
      <div>Código da sua sala:</div>
      <div class="room-code" id="roomCodeDisplay">------</div>
      <div class="opponent hidden" id="opponentLine"><i data-lucide="user-check" style="width:18px;height:18px;color:var(--ok)"></i> <span id="opponentName">Amigo</span> conectado!</div>
      <button class="btn btn-primary btn-block hidden" id="btnStartOnline" style="margin-top:14px"><i data-lucide="play" style="width:18px;height:18px"></i> Começar partida</button>
    </div>
  </div>
</div>

<script>
lucide.createIcons();

let currentUser = "";
let peer = null;
let conn = null;

// Configuração ICE STUN para conexão 100% direta (passa por firewalls e roteadores)
const peerConfig = {
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' }
    ]
  }
};

// Telas
const loginScreen = document.getElementById('loginScreen');
const menuScreen = document.getElementById('menuScreen');
const lobbyScreen = document.getElementById('lobbyScreen');

// Login
document.getElementById('btnLogin').addEventListener('click', () => {
  const name = document.getElementById('loginUser').value.trim();
  if(!name) return alert('Digite seu nome!');
  currentUser = name;
  document.getElementById('userName').innerText = currentUser;
  document.getElementById('userAvatar').innerText = currentUser.charAt(0).toUpperCase();
  loginScreen.classList.add('hidden');
  menuScreen.classList.remove('hidden');
});

document.getElementById('btnLogout').addEventListener('click', () => {
  if(peer) peer.destroy();
  location.reload();
});

document.getElementById('cardCaca').addEventListener('click', () => {
  menuScreen.classList.add('hidden');
  lobbyScreen.classList.remove('hidden');
});

document.getElementById('lobbyBack').addEventListener('click', () => {
  if(peer) peer.destroy();
  lobbyScreen.classList.add('hidden');
  menuScreen.classList.remove('hidden');
  resetLobbyUI();
});

// Gerar Código de Sala Limpo
function generateCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) {
    code += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return code;
}

// CRIAR SALA (Host)
document.getElementById('btnCreateRoom').addEventListener('click', () => {
  const roomCode = generateCode();
  const fullPeerId = "LS-GAME-" + roomCode;
  
  document.getElementById('lobbyCreate').classList.add('hidden');
  document.getElementById('lobbyRoom').classList.remove('hidden');
  document.getElementById('roomCodeDisplay').innerText = roomCode;
  document.getElementById('lobbyStatus').innerText = "Aguardando seu amigo colocar o código...";

  peer = new Peer(fullPeerId, peerConfig);

  peer.on('open', (id) => {
    console.log('Sala criada com ID:', id);
  });

  peer.on('connection', (connection) => {
    conn = connection;
    setupConnectionEvents();
  });

  peer.on('error', (err) => {
    console.error('Erro na sala:', err);
    alert('Erro ao gerar código da sala. Tentando novamente...');
    resetLobbyUI();
  });
});

// ENTRAR NA SALA (Guest)
document.getElementById('btnJoinRoom').addEventListener('click', () => {
  const inputCode = document.getElementById('joinCode').value.trim().toUpperCase();
  if(inputCode.length !== 6) return alert('Digite o código de 6 dígitos corretamente!');

  const targetPeerId = "LS-GAME-" + inputCode;
  
  document.getElementById('lobbyCreate').classList.add('hidden');
  document.getElementById('lobbyRoom').classList.remove('hidden');
  document.getElementById('roomCodeDisplay').innerText = inputCode;
  document.getElementById('lobbyStatus').innerText = "Conectando imediatamente...";

  // Peer do Convidado
  peer = new Peer(peerConfig);

  peer.on('open', () => {
    conn = peer.connect(targetPeerId, { reliable: true });
    setupConnectionEvents();
  });

  peer.on('error', (err) => {
    console.error('Erro ao conectar:', err);
    alert('Não foi possível encontrar a sala. Verifique se o código está correto ou se a sala já foi criada.');
    resetLobbyUI();
  });
});

// Trata os eventos de conexão sem falhas
function setupConnectionEvents() {
  conn.on('open', () => {
    document.getElementById('lobbyStatus').className = "lobby-status ok";
    document.getElementById('lobbyStatus').innerText = "Conectado com sucesso!";
    document.getElementById('opponentLine').classList.remove('hidden');
    document.getElementById('btnStartOnline').classList.remove('hidden');
    
    // Envia nome para o outro jogador
    conn.send({ type: 'JOIN_INFO', name: currentUser });
  });

  conn.on('data', (data) => {
    if(data.type === 'JOIN_INFO') {
      document.getElementById('opponentName').innerText = data.name;
    }
  });

  conn.on('close', () => {
    alert('Seu amigo desconectou.');
    resetLobbyUI();
  });
}

function resetLobbyUI() {
  document.getElementById('lobbyCreate').classList.remove('hidden');
  document.getElementById('lobbyRoom').classList.add('hidden');
  document.getElementById('opponentLine').classList.add('hidden');
  document.getElementById('btnStartOnline').classList.add('hidden');
  document.getElementById('lobbyStatus').className = "lobby-status wait";
  document.getElementById('joinCode').value = "";
}
</script>
</body>
</html>
