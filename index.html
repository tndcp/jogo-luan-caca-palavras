<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caça-Palavras Luan Santana</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;color:#fff;padding:20px}
.container{max-width:700px;margin:0 auto}
h1{text-align:center;color:#f2c94c;margin-bottom:20px;font-size:24px}
.tela{background:rgba(0,0,0,0.3);border-radius:16px;padding:30px;margin-bottom:20px}
.escondida{display:none}
input{width:100%;padding:14px;font-size:18px;border:none;border-radius:10px;background:rgba(255,255,255,0.1);color:#fff;margin-bottom:15px}
button{width:100%;padding:14px;font-size:18px;border:none;border-radius:10px;background:linear-gradient(90deg,#f2c94c,#d32f2f);color:#000;font-weight:bold;cursor:pointer}
.grade{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:20px 0}
.casa{aspect-ratio:1;background:rgba(255,255,255,0.1);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;user-select:none}
.casa.selecionada{background:#f2c94c;color:#000}
.casa.encontrada{background:#4caf50;color:#fff}
.palavras{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.palavra{padding:8px 12px;background:rgba(255,255,255,0.1);border-radius:8px}
.palavra.encontrada{opacity:0.5;text-decoration:line-through}
.placar{text-align:center;font-size:20px;margin-bottom:15px;color:#f2c94c}
</style>
</head>
<body>
<div class="container">

<div id="telaEntrada" class="tela">
  <h1>🎸 Caça-Palavras<br>Luan Santana</h1>
  <input type="text" id="nomeJogador" placeholder="Digite seu nome">
  <button onclick="entrarJogo()">Entrar no Jogo 🎮</button>
</div>

<div id="telaJogo" class="tela escondida">
  <h1>🎸 Olá, <span id="mostraNome"></span>!</h1>
  <div class="placar">Pontos: <span id="pontos">0</span></div>
  <div class="grade" id="grade"></div>
  <h3>Palavras a encontrar:</h3>
  <div class="palavras" id="listaPalavras"></div>
  <br>
  <button onclick="reiniciar()">🔄 Novo Jogo</button>
</div>

</div>

<script>
const palavrasLista = ['LUAN','SANTANA','SERESTA','FORRO','AMOR','CANCAO','VIOLAO','FESTA','BRASIL','ESTRELA'];
const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
let grade = [], selecionadas = [], encontradas = [], pontos = 0, jogador = '';

function entrarJogo(){
  jogador = document.getElementById('nomeJogador').value.trim();
  if(!jogador){alert('Digite seu nome!');return}
  document.getElementById('telaEntrada').classList.add('escondida');
  document.getElementById('telaJogo').classList.remove('escondida');
  document.getElementById('mostraNome').textContent = jogador;
  iniciarJogo();
}

function iniciarJogo(){
  pontos = 0; document.getElementById('pontos').textContent = 0;
  encontradas = []; selecionadas = [];
  grade = Array(10).fill().map(()=>Array(10).fill(''));
  
  palavrasLista.forEach(palavra=>{
    let ok=false,t=0;
    while(!ok&&t<100){
      let dir=Math.random()>0.5;
      let l=Math.floor(Math.random()*(10-(dir?0:palavra.length)));
      let c=Math.floor(Math.random()*(10-(dir?palavra.length:0)));
      let cabe=true;
      for(let i=0;i<palavra.length;i++){
        let nl=dir?l:l+i, nc=dir?c+i:c;
        if(grade[nl][nc]&&grade[nl][nc]!==palavra[i]){cabe=false;break}
      }
      if(cabe){
        for(let i=0;i<palavra.length;i++){
          let nl=dir?l:l+i, nc=dir?c+i:c;
          grade[nl][nc]=palavra[i];
        }
        ok=true;
      }
      t++;
    }
  });
  for(let l=0;l<10;l++)for(let c=0;c<10;c++)if(!grade[l][c])grade[l][c]=letras[Math.floor(Math.random()*26)];
  renderizar();
}

function renderizar(){
  const gradeEl=document.getElementById('grade');
  gradeEl.innerHTML='';
  for(let l=0;l<10;l++)for(let c=0;c<10;c++){
    const d=document.createElement('div');
    d.className='casa';d.textContent=grade[l][c];
    d.onclick=()=>clicar(l,c);
    if(selecionadas.some(p=>p.l===l&&p.c===c))d.classList.add('selecionada');
    gradeEl.appendChild(d);
  }
  const listaEl=document.getElementById('listaPalavras');
  listaEl.innerHTML='';
  palavrasLista.forEach(p=>{
    const d=document.createElement('div');
    d.className='palavra'+(encontradas.includes(p)?' encontrada':'');
    d.textContent=p; listaEl.appendChild(d);
  });
}

function clicar(l,c){
  const i=selecionadas.findIndex(p=>p.l===l&&p.c===c);
  if(i>=0){selecionadas.splice(i);renderizar();return}
  selecionadas.push({l,c});
  if(selecionadas.length>=2){
    const lin=[...new Set(selecionadas.map(p=>p.l))];
    const col=[...new Set(selecionadas.map(p=>p.c))];
    let txt='';
    if(lin.length===1){
      selecionadas.sort((a,b)=>a.c-b.c);
      txt=selecionadas.map(p=>grade[p.l][p.c]).join('');
    }else if(col.length===1){
      selecionadas.sort((a,b)=>a.l-b.l);
      txt=selecionadas.map(p=>grade[p.l][p.c]).join('');
    }
    const rev=txt.split('').reverse().join('');
    if(palavrasLista.includes(txt)&&!encontradas.includes(txt)){
      encontradas.push(txt);pontos+=txt.length*10;
      document.getElementById('pontos').textContent=pontos;
      selecionadas=[];
      if(encontradas.length===palavrasLista.length)setTimeout(()=>alert(`🎉 Parabéns ${jogador}! Pontos: ${pontos}`),300);
    }else if(palavrasLista.includes(rev)&&!encontradas.includes(rev)){
      encontradas.push(rev);pontos+=rev.length*10;
      document.getElementById('pontos').textContent=pontos;
      selecionadas=[];
      if(encontradas.length===palavrasLista.length)setTimeout(()=>alert(`🎉 Parabéns ${jogador}! Pontos: ${pontos}`),300);
    }
  }
  renderizar();
}

function reiniciar(){selecionadas=[];iniciarJogo()}
</script>
</body>
</html>
