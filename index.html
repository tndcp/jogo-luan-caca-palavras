*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:#121225;color:#fff}
.container{max-width:520px;margin:0 auto}
h1{text-align:center;color:#ffd700;margin:14px 0;font-size:26px;letter-spacing:.5px}
h2{color:#ffd700;margin:14px 0;text-align:center;font-size:20px}
.tela{animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
input,select{width:100%;padding:15px;font-size:16px;border-radius:14px;background:#24244a;color:#fff;margin-bottom:10px;border:2px solid #3a3a6a;outline:none}
input:focus{border-color:#ffd700}
button{width:100%;padding:14px 16px;font-size:16px;border:none;border-radius:14px;font-weight:800;cursor:pointer;margin:6px 0;transition:.15s}
button:active{transform:scale(.97)}
button.primario{background:#ffd700;color:#111}
button.secundario{background:#2a2a4e;color:#fff}
button.ranqueada{background:#9c27b0;color:#fff}
button.amigo{background:#ff5722;color:#fff}
button.loja{background:#00bcd4;color:#fff}
button.mestre{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;border:2px solid #fff;box-shadow:0 0 18px #ffd70066}
button.som{background:#3a3a5c;color:#fff;width:auto;padding:8px 12px;font-size:13px;border-radius:20px}
button:disabled{opacity:.4;cursor:not-allowed}
.erro{color:#ff6b6b;text-align:center;margin:8px 0;min-height:22px;font-weight:600}
.moedas{text-align:center;font-size:20px;color:#ffd700;font-weight:900;margin:10px 0}
.patente{text-align:center;padding:10px;border-radius:12px;margin:10px 0;font-weight:800;border:1px solid #333}
.placar{display:flex;gap:8px;margin:12px 0}
.caixa{flex:1;text-align:center;padding:10px;background:#24244a;border-radius:12px}
.caixa div:first-child{font-size:12px;opacity:.7}
.caixa div:last-child{font-size:18px;font-weight:900;color:#ffd700}
.grade{display:grid;gap:4px;margin:16px 0;touch-action:none;user-select:none}
.casa{aspect-ratio:1;background:#24244a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer;user-select:none;font-size:15px;border:1px solid #2f2f5a;transition:.1s;touch-action:none}
.casa.selecionada{background:#ffd700;color:#000;transform:scale(1.05)}
.casa.encontrada{background:#2e7d32 !important;color:#fff !important;border-color:#4caf50}
.casa.dica{background:#00bcd4 !important;color:#000 !important}
.palavras{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.palavra{padding:8px 12px;background:#24244a;border-radius:20px;font-size:13px;font-weight:700;border:1px solid #333}
.palavra.encontrada{opacity:.35;text-decoration:line-through;background:#2e7d32}
.abas{display:flex;gap:6px;margin:15px 0}
.aba{flex:1;padding:10px;background:#24244a;border-radius:10px;text-align:center;cursor:pointer;font-size:14px}
.aba.ativa{background:#ffd700;color:#000}
.lista{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.item{display:flex;gap:10px;padding:12px;background:#24244a;border-radius:12px;align-items:center}
.item.voce{border:2px solid #ffd700;background:#2a2a15}
.oculta{display:none !important}
.card{padding:12px;border-radius:12px;text-align:center;margin:10px 0;border:1px solid #333}
.destaque-ranqueada{background:#9c27b033;border-color:#9c27b0}
.destaque-normal{background:#4caf5033;border-color:#4caf50}
.destaque-amigo{background:#ff572233;border-color:#ff5722}
.destaque-mestre{background:linear-gradient(135deg,#ffd70022,#ff8c0022);border:2px solid #ffd700;padding:14px}
.cabecalho{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.codigo-sala{background:#24244a;padding:14px;border-radius:12px;text-align:center;font-size:26px;font-weight:900;color:#ffd700;letter-spacing:6px;margin:10px 0;border:2px dashed #ffd700}
.status-sala{text-align:center;margin:10px 0;padding:10px;border-radius:10px;background:#24244a}
.vantagens{background:#ffd70015;border:1px solid #ffd70055;border-radius:12px;padding:12px;margin:10px 0;font-size:13px;line-height:1.6}
