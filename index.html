<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luan Coins 💰</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#1a1a2e;color:#fff;min-height:100vh;padding:20px}
.container{max-width:460px;margin:0 auto}
h1{text-align:center;color:#ffd700;margin:30px 0;font-size:28px}
.tela{display:none}
.tela.ativa{display:block}
input{width:100%;padding:16px;font-size:18px;border:none;border-radius:12px;background:#2a2a4e;color:#fff;margin-bottom:15px;border:2px solid #444}
button{width:100%;padding:16px;font-size:18px;border:none;border-radius:12px;font-weight:bold;cursor:pointer;margin:8px 0}
button.primario{background:#ffd700;color:#000}
button.secundario{background:#2e7d32;color:#fff}
.erro{color:#ff6b6b;text-align:center;margin:10px 0;min-height:24px}
</style>
</head>
<body>
<div class="container">

<!-- TELA LOGIN -->
<div id="telaLogin" class="tela ativa">
  <h1>🎸 Luan Coins 💰</h1>
  <input type="text" id="campoUsuario" placeholder="Digite seu nome">
  <div id="msgErro" class="erro"></div>
  <button class="primario" id="botaoEntrar">🎵 Entrar</button>
  <button class="secundario" id="botaoCriarLink">📝 Criar Conta</button>
</div>

<!-- TELA CADASTRO -->
<div id="telaCadastro" class="tela">
  <h1>📝 Nova Conta</h1>
  <input type="text" id="campoNovoUsuario" placeholder="Escolha seu nome">
  <div id="msgErroCad" class="erro"></div>
  <button class="primario" id="botaoCadastrar">✅ Criar Conta</button>
  <button class="secundario" id="botaoVoltar">← Voltar</button>
</div>

<!-- TELA PRINCIPAL -->
<div id="telaPrincipal" class="tela">
  <h1>Bem-vindo, <span id="mostrarNome"></span>! ✅</h1>
  <p style="text-align:center;font-size:20px;margin:30px 0;color:#4caf50">Sistema funcionando! 🎉</p>
  <button class="secundario" id="botaoSair">🚪 Sair</button>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAkZYDcCsua7qzmdZDj__KIrYTAWIslvsI",
  authDomain: "luan-coins.firebaseapp.com",
  databaseURL: "https://luan-coins-default-rtdb.firebaseio.com",
  projectId: "luan-coins",
  storageBucket: "luan-coins.firebasestorage.app",
  messagingSenderId: "379641584803",
  appId: "1:379641584803:web:c1bfc0c0715e3347fef316"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const refContas = db.ref('contas');

let usuarioAtual = null;

// TROCAR TELAS
function mostrarTela(id){
  document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
  document.getElementById(id).classList.add('ativa');
}

// ENTRAR
async function entrar(){
  const nome = document.getElementById('campoUsuario').value.trim();
  const erro = document.getElementById('msgErro');
  
  if(!nome){
    erro.textContent = 'Digite seu nome!';
    return;
  }
  
  const snap = await refContas.child(nome).once('value');
  if(!snap.exists()){
    erro.textContent = 'Usuário não existe! Crie conta primeiro.';
    return;
  }
  
  usuarioAtual = nome;
  document.getElementById('mostrarNome').textContent = nome;
  erro.textContent = '';
  mostrarTela('telaPrincipal');
}

// CRIAR CONTA
async function criarConta(){
  const nome = document.getElementById('campoNovoUsuario').value.trim();
  const erro = document.getElementById('msgErroCad');
  
  if(nome.length < 3){
    erro.textContent = 'Mínimo 3 letras!';
    return;
  }
  
  if((await refContas.child(nome).once('value')).exists()){
    erro.textContent = 'Já existe! Entre direto!';
    return;
  }
  
  await refContas.child(nome).set({moedas: 50});
  alert('✅ Conta criada! Agora é só entrar!');
  mostrarTela('telaLogin');
  document.getElementById('campoUsuario').value = nome;
}

// SAIR
function sair(){
  usuarioAtual = null;
  document.getElementById('campoUsuario').value = '';
  mostrarTela('telaLogin');
}

// CONECTAR BOTÕES — AQUI ESTÁ A SOLUÇÃO!
document.addEventListener('DOMContentLoaded', function(){
  console.log('✅ Sistema carregado!');
  
  document.getElementById('botaoEntrar').addEventListener('click', entrar);
  document.getElementById('botaoCriarLink').addEventListener('click', () => mostrarTela('telaCadastro'));
  document.getElementById('botaoVoltar').addEventListener('click', () => mostrarTela('telaLogin'));
  document.getElementById('botaoCadastrar').addEventListener('click', criarConta);
  document.getElementById('botaoSair').addEventListener('click', sair);
});
</script>
</body>
</html>
