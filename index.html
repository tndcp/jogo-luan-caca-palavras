<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jogos - Sala com Amigos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0f0f13;color:#fff}
.container{width:100%;max-width:480px;margin:0 auto;padding:16px}
.card{background:#1c1c22;border-radius:20px;padding:16px;margin-top:14px;border:1px solid #2a2a32}
button{width:100%;padding:15px;border-radius:14px;border:0;background:#7c5cff;color:#fff;font-weight:800;font-size:16px;margin-top:10px}
button.sec{background:#2a2a32}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;margin-top:8px;text-transform:uppercase;font-size:16px}
.codigo{font-size:36px;font-weight:900;letter-spacing:5px;text-align:center;color:#7c5cff;padding:10px 0}
.grid{display:grid;grid-template-columns:repeat(var(--c),1fr);width:100%;max-width:95vw;margin:0 auto;aspect-ratio:1/1;gap:3px}
.cel{background:#2a2a32;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(14px,4.5vw,20px);aspect-ratio:1/1}
.cel.sel{background:#7c5cff}
.hidden{display:none}
.flex{display:flex;gap:8px}
.badge{background:#121214;border:1px dashed #7c5cff;border-radius:12px;padding:12px;text-align:center}
.admin{border:1px solid #ffcc00;background:#1c1c0f}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// COLE SEU FIREBASE AQUI
const firebaseConfig = {
  apiKey: "COLOQUE_SUA_APIKEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO",
  storageBucket: "SEU_PROJETO.appspot.com",
  messagingSenderId: "SEU_ID",
  appId: "SEU_APPID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.DB = db; window.DOC=doc; window.SET=setDoc; window.GET=getDoc; window.UPD=updateDoc; window.ARR=arrayUnion; window.SNAP=onSnapshot;
</script>
</head>
<body>
<div class="container">
<h2>🎮 Escolha o jogo</h2>

<div id="menu" class="card">
<button onclick="criar('adedonha')">🔤 ADEDONHA</button>
<button onclick="criar('caca')">🔍 CAÇA-PALAVRAS</button>
<button class="sec" onclick="document.getElementById('admin').classList.toggle('hidden')">⚙️ Minha conta - Robozinho</button>
</div>

<div id="admin" class="card admin hidden">
<h3>🤖 Seu Robozinho</h3>
<p style="opacity:.7;font-size:13px">Ative ou desative por modo. Só você controla.</p>
<div style="display:flex;justify-content:space-between;margin-top:12px">Robô Adedonha <input type="checkbox" id="bA" checked onchange="saveBot()"></div>
<div style="display:flex;justify-content:space-between;margin-top:12px">Robô Caça-Palavras <input type="checkbox" id="bC" checked onchange="saveBot()"></div>
</div>

<div id="game" class="hidden">
<div class="card badge">
<small>MODO: <b id="modoT"></b></small>
<div class="codigo" id="codT">------</div>
<small id="stat">Sala ativa</small>
<button onclick="copiar()">📋 COPIAR CÓDIGO / LINK PARA AMIGO</button>
<div class="flex"><input id="inCod" placeholder="TEM CÓDIGO? COLE AQUI"><button style="width:110px" onclick="entrarCod()">ENTRAR</button></div>
<div id="players" style="margin-top:10px;font-size:13px;opacity:.8"></div>
</div>

<div id="adedonhaBox" class="card hidden">
<h3>Adedonha</h3>
<p id="infoA"></p>
<input id="inpA" placeholder="Ex: Abacaxi">
<button onclick="alert('Resposta enviada!')">Enviar palavra</button>
</div>

<div id="cacaBox" class="card hidden">
<h3>Caça-Palavras</h3>
<p id="infoC"></p>
<div id="grid" class="grid"></div>
<p style="margin-top:8px;font-size:12px">Palavras: BOLA, JOGO, AMIGO</p>
</div>

<button class="sec" onclick="location.href=location.pathname">← Sair da sala</button>
</div>
</div>

<script>
function gen(){return Math.random().toString(36).substring(2,8).toUpperCase()}
window.criar = async function(modo){
const codigo = gen().trim().toUpperCase();
await SET(DOC(DB,"salas",codigo),{codigo,modo,jogadores:["Você"],criado:new Date()});
abrir(modo,codigo);
}
window.entrarCod = async function(){
const c = document.getElementById('inCod').value.trim().toUpperCase();
if(!c) return;
const r = DOC(DB,"salas",c);
const s = await GET(r);
if(!s.exists()){alert('CODIGO INVALIDO OU NAO ENCONTRADO');return}
await UPD(r,{jogadores:ARR('Amigo')});
abrir(s.data().modo,c);
}
function abrir(modo,codigo){
document.getElementById('menu').classList.add('hidden');
document.getElementById('game').classList.remove('hidden');
document.getElementById('modoT').innerText=modo.toUpperCase();
document.getElementById('codT').innerText=codigo;
document.getElementById('adedonhaBox').classList.toggle('hidden',modo!=='adedonha');
document.getElementById('cacaBox').classList.toggle('hidden',modo!=='caca');
if(modo==='caca') montaCaca();
saveBot();
const u = new URL(location.href);u.searchParams.set('codigo',codigo);u.searchParams.set('modo',modo);history.replaceState({},'',u);
SNAP(DOC(DB,"salas",codigo),(d)=>{if(d.exists()){document.getElementById('players').innerText='Na sala: '+(d.data().jogadores||[]).join(', ')}});
}
function montaCaca(){
const g=document.getElementById('grid');g.style.setProperty('--c',10);g.innerHTML='';
for(let i=0;i<100;i++){let d=document.createElement('div');d.className='cel';d.innerText=String.fromCharCode(65+Math.floor(Math.random()*26));d.onclick=()=>d.classList.toggle('sel');g.appendChild(d)}
}
window.copiar=function(){
const cod=document.getElementById('codT').innerText;
const modo=document.getElementById('modoT').innerText.toLowerCase();
const link=`${location.origin}${location.pathname}?codigo=${cod}&modo=${modo}`;
navigator.clipboard.writeText(link);alert('Copiado! Mande para o amigo:\n'+link);
}
window.saveBot=function(){
localStorage.setItem('botA',document.getElementById('bA').checked);
localStorage.setItem('botC',document.getElementById('bC').checked);
const a=localStorage.getItem('botA')!=='false';
const c=localStorage.getItem('botC')!=='false';
document.getElementById('infoA').innerText=a?'🤖 Robozinho ATIVADO':'🤖 Robozinho DESATIVADO';
document.getElementById('infoC').innerText=c?'🤖 Robozinho ATIVADO':'🤖 Robozinho DESATIVADO';
}
window.addEventListener('load',async()=>{
document.getElementById('bA').checked=localStorage.getItem('botA')!=='false';
document.getElementById('bC').checked=localStorage.getItem('botC')!=='false';
saveBot();
const p=new URLSearchParams(location.search);const cod=p.get('codigo');const modo=p.get('modo');
if(cod){document.getElementById('inCod').value=cod;const s=await GET(DOC(DB,"salas",cod.toUpperCase()));if(s.exists())abrir(s.data().modo,cod.toUpperCase());}
});
</script>
</body>
</html>
